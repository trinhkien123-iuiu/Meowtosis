<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mèo tắm nắng</title>
<link rel="stylesheet" href="cozy.css">
<style>
  #board { display: grid; gap: 4px; padding: 10px; background: var(--wood); border-radius: 18px; box-shadow: 0 6px 0 var(--wood-dark); margin: 6px 0; }
  .cell { width: min(15vw, 66px); height: min(15vw, 66px); border-radius: 12px; display: flex; align-items: center; justify-content: center;
          font-size: min(9vw, 40px); position: relative; background: #d9b98a; transition: background .25s, box-shadow .25s; cursor: default; }
  .cell.lit { background: var(--sun); box-shadow: inset 0 0 14px 4px rgba(255,255,255,.7), 0 0 14px rgba(255,215,106,.9); }
  .cell.wall { background: #7a5233; }
  .cell.window { background: transparent; box-shadow: none; font-size: min(8vw, 34px); }
  .cell.free { cursor: pointer; }
  .cell.free:hover { outline: 3px dashed rgba(255,255,255,.7); }
  .cell.selected { outline: 4px solid #fff; }
  .cell.happy::after { content: "♥"; position: absolute; right: 4px; top: 1px; font-size: .38em; color: #e0607e; }
  #legend { font-size: .9rem; padding: 0 16px 24px; text-align: center; max-width: 560px; }
</style>
</head>
<body>
<div class="top"><a class="btn small" href="index.html">← Menu</a><h1>☀️ Mèo tắm nắng</h1><button class="btn small" id="reset">Làm lại</button></div>
<div class="info" id="info"></div>
<div id="board"></div>
<div class="bar"><span class="pill" id="level"></span><span class="pill" id="moves"></span><button class="btn small" id="prev">◀</button><button class="btn small" id="next">▶</button></div>
<div id="legend">🐱 mèo thích nắng · 😼 mèo thích bóng · 🪴 chậu cây (che nắng phía sau) · 📦 đồ đứng yên · 🪟 cửa sổ.<br>Chạm một món để chọn, rồi chạm ô trống để dời tới.</div>
<div class="win" id="win"><div class="card"><div class="big">😻</div><h2>Mèo thoải mái rồi!</h2><p id="winText"></p><button class="btn green" id="winNext">Màn tiếp ▶</button></div></div>
<script src="sunbeam-core.js"></script>
<script src="sunbeam-levels.js"></script>
<script>
const levels = window.SUNBEAM_LEVELS;
let levelIndex = 0;
let level, state, selected, moves;

const $ = (id) => document.getElementById(id);

function loadLevel(index) {
  levelIndex = (index + levels.length) % levels.length;
  level = levels[levelIndex];
  state = Sunbeam.startState(level);
  selected = null;
  moves = 0;
  $('win').classList.remove('show');
  render();
}

// Món trên bàn: { type: 'cat'|'plant', index } theo vị trí hiện tại.
function itemAt(pos) {
  const catIndex = state.cats.findIndex((cat) => cat.pos === pos);
  if (catIndex >= 0) return { type: 'cat', index: catIndex };
  const plantIndex = state.plants.indexOf(pos);
  if (plantIndex >= 0) return { type: 'plant', index: plantIndex };
  return null;
}

function render() {
  const { W, H } = level;
  const lit = Sunbeam.litCells(level, new Set(state.plants));
  const happy = Sunbeam.catsHappy(level, state);
  const walls = new Set(level.walls.map(([r, c]) => r * W + c));
  const board = $('board');
  board.style.gridTemplateColumns = `repeat(${W + 1}, auto)`;
  board.innerHTML = '';

  const addCell = (className, text, onClick) => {
    const cell = document.createElement('div');
    cell.className = 'cell ' + className;
    cell.textContent = text || '';
    if (onClick) cell.addEventListener('click', onClick);
    board.appendChild(cell);
    return cell;
  };

  addCell('window', '');
  for (let c = 0; c < W; c++) addCell('window', level.cols.includes(c) ? '🪟' : '');
  for (let r = 0; r < H; r++) {
    addCell('window', level.rows.includes(r) ? '🪟' : '');
    for (let c = 0; c < W; c++) {
      const pos = r * W + c;
      if (walls.has(pos)) { addCell('wall', '📦'); continue; }
      const item = itemAt(pos);
      let face = '';
      let extra = '';
      if (item && item.type === 'plant') face = '🪴';
      if (item && item.type === 'cat') {
        const cat = state.cats[item.index];
        const ok = happy[item.index];
        face = cat.kind === 'sun' ? (ok ? '😸' : '🐱') : (ok ? '😴' : '😼');
        if (ok) extra = ' happy';
      }
      const isSelected = selected !== null && selected === pos;
      const cell = addCell((lit.has(pos) ? 'lit' : '') + (item ? '' : ' free') + (isSelected ? ' selected' : '') + extra, face, () => onCell(pos));
      if (item) cell.style.cursor = 'pointer';
    }
  }

  const sunCats = state.cats.filter((cat) => cat.kind === 'sun').length;
  $('level').textContent = `Màn ${levelIndex + 1}/${levels.length}`;
  $('moves').textContent = `Dời: ${moves}`;
  const done = happy.filter(Boolean).length;
  $('info').textContent = `Mèo hài lòng: ${done}/${state.cats.length}` + (sunCats === 0 ? '' : '');
}

function onCell(pos) {
  const item = itemAt(pos);
  if (item) {
    selected = selected === pos ? null : pos;
    render();
    return;
  }
  if (selected === null) return;
  const moving = itemAt(selected);
  if (moving.type === 'cat') state.cats[moving.index].pos = pos; else state.plants[moving.index] = pos;
  selected = null;
  moves++;
  render();
  if (Sunbeam.isSolved(level, state)) {
    $('winText').textContent = `Xong màn ${levelIndex + 1} sau ${moves} lần dời.`;
    setTimeout(() => $('win').classList.add('show'), 350);
  }
}

$('reset').onclick = () => loadLevel(levelIndex);
$('prev').onclick = () => loadLevel(levelIndex - 1);
$('next').onclick = () => loadLevel(levelIndex + 1);
$('winNext').onclick = () => loadLevel(levelIndex + 1);
loadLevel(0);
</script>
</body>
</html>
