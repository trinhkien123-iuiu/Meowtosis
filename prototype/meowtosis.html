  const to = step(level, t.from, t.dir), m = SZ / 2;
  const [fx0, fy0] = pos(t.from), [tx, ty] = pos(to);
  const W = level.w * SZ, H = level.h * SZ;
  const hole = (x, y) => `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="#000"/>`;
  // Chỉ làm tối đúng hình khung bàn chơi, chừa ô mèo cần vuốt và ô đích
  holder.innerHTML = `<defs><mask id="spot"><rect x="-40" y="-40" width="${W + 80}" height="${H + 80}" fill="#fff"/>${hole(fx0, fy0)}${hole(tx, ty)}</mask></defs>
    <path d="${outlinePath(level, 19, 34, 20)}" fill="#030a35" opacity=".5" mask="url(#spot)"/>
    <line class="trail" x1="${fx0 + m}" y1="${fy0 + m}" x2="${tx + m}" y2="${ty + m}" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
    <g class="hand" style="--dx:${tx - fx0}px; --dy:${ty - fy0}px"><text x="${fx0 + m}" y="${fy0 + m + 40}" font-size="46" text-anchor="middle">👆</text></g>`;
}

function buildBoard() {
  board.setAttribute('viewBox', `-24 -24 ${level.w * SZ + 48} ${level.h * SZ + 52}`);
  board.innerHTML = `${baseSvg(level)}<g id="layer"></g><g>${wallsSvg(level)}${portalSvg(level)}</g><g id="coachLayer"></g><g id="overlay"></g>`;
  layer = $('layer');
  overlay = $('overlay');
  nodes = new Map();
}

function makeCell(c) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'cell');
  g.innerHTML = cellBody(c);
  g.dataset.sleep = c.sleep ? '1' : '';
  g.dataset.dual = c.alt ? c.color + c.left : '';
  return g;
}

// Đồng bộ DOM với mảng tế bào: tế bào cũ trượt tới chỗ mới, tế bào mới mọc ra từ ô mẹ (`born`: id -> ô).
// `keep`: tế bào đã rời bàn nhưng còn đang vỡ. Tế bào vừa thức dậy được vẽ lại với mắt mở.
function sync(view, born = null, keep = []) {
  shown = view;
  const alive = new Set(keep.map(c => c.id));
  view.forEach((c, i) => {
    if (!c) return;
    alive.add(c.id);
    let g = nodes.get(c.id);
    const [x, y] = pos(i);
    if (!g) {
      g = makeCell(c);
      nodes.set(c.id, g);
      layer.appendChild(g);
      const from = born && born.get(c.id);
      if (from !== undefined && from !== null) {
        const [fx0, fy0] = pos(from);
        g.style.transform = `translate(${fx0}px, ${fy0}px)`;
        g.classList.add('born');
        g.getBoundingClientRect();           // ép trình duyệt ghi nhận vị trí đầu trước khi trượt
      }
    } else if (!!c.sleep !== !!g.dataset.sleep) {
      g.innerHTML = cellBody(c);
      g.dataset.sleep = c.sleep ? '1' : '';
      if (!c.sleep) jolt(g, 'waking');
    } else if ((c.alt ? c.color + c.left : '') !== g.dataset.dual) {
      // mèo hai màu: đếm lùi hoặc vừa đổi màu thì vẽ lại thân và huy hiệu
      const flipped = (g.dataset.dual || '')[0] !== c.color;
      g.innerHTML = cellBody(c);
      g.dataset.dual = c.alt ? c.color + c.left : '';
      if (flipped) jolt(g, 'waking');
    }
    g.classList.toggle('asleep', !!c.sleep);
    g.style.transform = `translate(${x}px, ${y}px)`;
  });
  for (const [id, g] of nodes) if (!alive.has(id)) { g.remove(); nodes.delete(id); }
}

const pop = list => { for (const c of list) nodes.get(c.id)?.classList.add('pop'); };
const slotOf = (view, c) => view.indexOf(c);

// Chạy một hiệu ứng CSS trên một con, lệch theo hướng `dir`: dist đơn vị, co dọc hướng còn `squash`, trễ `delay` giây.
function act(id, cls, dir, dist = 6, delay = 0, squash = .86) {
  const g = nodes.get(id);
  if (!g) return;
  const [dx, dy] = LOOK[dir] || [0, 0], wide = 2 - squash;
  g.style.setProperty('--px', `${dx * dist}px`);
  g.style.setProperty('--py', `${dy * dist}px`);
  g.style.setProperty('--sx', dx ? squash : wide);
  g.style.setProperty('--sy', dy ? squash : wide);
  g.style.setProperty('--d', `${delay}s`);
  jolt(g, cls);
}

// Một nhóm SVG tạm trên lớp phủ tại ô i, tự gỡ sau `ms`
function overlayAt(i, html, ms) {
  const [x, y] = pos(i), el = document.createElementNS(NS, 'g');
  el.setAttribute('transform', `translate(${x} ${y})`);
  el.innerHTML = html;
  overlay.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// Mắt @@ xoay tròn đè lên đúng chỗ mắt (ảnh mèo Shikacat hoặc kẹo tự vẽ): dùng cho mèo choáng và hồn mèo
function swirlEyes() {
  const m = SZ / 2, eyes = catArt ? [[m - 15, m - 20], [m + 10, m - 20]] : [[m - 11, m - 4], [m + 11, m - 4]];
  return eyes.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#fff"/>
    <text class="swirl" x="${x}" y="${y + 6}" font-size="18" font-weight="800" text-anchor="middle" fill="#2b0f2e">@</text>`).join('');
}

// Hồn mèo mắt @@ bay lên khỏi ô độc
function ghost(i, c) {
  const m = SZ / 2, art = catArt && CAT[c.color]
    ? `<image class="soul" href="${catSrc(c.color)}" x="${m - 35}" y="${m - 43}" width="70" height="84"/>`
    : `<g class="soul">${cellShape(c)}</g>`;
  overlayAt(i, `<g class="soul-fx"><ellipse cx="${m}" cy="${m - 47}" rx="17" ry="5" fill="none" stroke="#fff6a0" stroke-width="3.5"/>${art}${swirlEyes()}</g>`, 1500);
}

// Hai hàm răng tím đớp lại ở ô i
const TEETH = Array.from({ length: 6 }, (_, k) => `L${14 + k * 11 + 5.5} 56 L${14 + (k + 1) * 11} 45`).join(' ');
function chomp(i) {
  const jaw = `<path d="M6 45 A39 39 0 0 1 84 45 Z" fill="#b56cff" stroke="#55208f" stroke-width="3"/><path d="M14 45 ${TEETH} Z" fill="#fff" stroke="#55208f" stroke-width="1.5" stroke-linejoin="round"/>`;
  overlayAt(i, `<g class="jaw top">${jaw}</g><g class="jaw bot"><g transform="rotate(180 45 45)">${jaw}</g></g>`, 520);
}

// Bị đẩy khỏi hộp đúng màu: mắt @@ và ba ngôi sao bay vòng trên đầu, đi theo con mèo
const STAR = Array.from({ length: 10 }, (_, k) => pt(0, -Math.PI / 2 + k * Math.PI / 5, k % 2 ? 3.2 : 8).replace(' ', ',')).join(' ');
function dizzy(id) {
  const g = nodes.get(id);
  if (!g) return;
  const m = SZ / 2, el = document.createElementNS(NS, 'g');
  el.setAttribute('class', 'dizzy-fx');
  el.innerHTML = swirlEyes() + `<g transform="translate(${m} ${m - 44})">` + [0, 1, 2].map(k =>
      `<polygon class="orbit-star" style="animation-delay:-${(k / 3).toFixed(2)}s" points="${STAR}" fill="#ffe27a" stroke="#b88300" stroke-width="1.5"/>`).join('') + '</g>';
  (g.querySelector('.lean') || g).appendChild(el);   // trong lớp lắc lư để mắt @@ đi theo đầu
  jolt(g, 'dazed');
  setTimeout(() => el.remove(), 1700);
}

// ---------------------------------------------------------------------------
// Mèo lúc rảnh: cứ ~1,3 giây có thể chọn một con đang thức cho làm một động tác (chớp mắt, ngó quanh, quay đầu,
// ngáp, vươn vai, dụi con bên cạnh). Không chạy khi đang vuốt, đang diễn hoạt, đang chọn booster, đã thắng/thua,
// trang bị ẩn hoặc máy bật "giảm chuyển động". Vuốt một nước là dừng hết (stopIdle).
// ---------------------------------------------------------------------------
const IDLE = ['idle-look-l', 'idle-look-r', 'idle-turn', 'idle-yawn', 'idle-stretch', 'idle-nuzzle', 'idle-pet', 'faceoff'];
const calm = matchMedia('(prefers-reduced-motion: reduce)');
const cellG = i => cells[i] && nodes.get(cells[i].id);
const isCat = i => { const c = cells[i]; return !!c && !c.sleep && level.colors.includes(c.color); };
const freeCats = () => cells.map((_, i) => (isCat(i) && cellG(i) && !cellG(i).dataset.idle ? i : -1)).filter(i => i >= 0);

// Cho con ở ô i làm động tác `cls` trong `ms`, kèm mặt vẽ đè `face` (nếu có); hết giờ thì trả về như cũ
function idleAct(i, cls, ms, face = '', faceCls = '') {
  const g = cellG(i), lean = g && g.querySelector('.lean');
  if (!lean) return;
  g.dataset.idle = '1';
  if (cls) jolt(g, cls);
  let el = null;
  if (face) {
    lean.insertAdjacentHTML('beforeend', `<g class="idlefx ${faceCls}">${face}</g>`);
    el = lean.lastElementChild;
    if (!catArt) g.classList.add('faceoff');
  }
  setTimeout(() => {
    el?.remove();
    if (cls) g.classList.remove(cls);
    if (face) g.classList.remove('faceoff');
    delete g.dataset.idle;
  }, ms);
}
function stopIdle() {
  for (const el of layer.querySelectorAll('.idlefx')) el.remove();
  for (const g of layer.querySelectorAll('[data-idle]')) { g.classList.remove(...IDLE); delete g.dataset.idle; }
}

const idle = {
  // Chớp mắt (mặt kẹo tự vẽ đã tự chớp bằng CSS); đôi khi chớp hai cái
  blink(i) {
    if (!catArt) return idle.look(i);
    const f = faceOf(cells[i]), lids = coverEyes(f) + shutEyes(f, 4);
    idleAct(i, '', 240, lids, 'blink');
    if (Math.random() < .35) setTimeout(() => { if (cellG(i) && !busy) idleAct(i, '', 240, lids, 'blink'); }, 320);
  },
  look(i) { idleAct(i, Math.random() < .5 ? 'idle-look-l' : 'idle-look-r', 1750); },
  turn(i) { idleAct(i, 'idle-turn', 2250); },
  // Ngáp: mắt nhắm thư thái, miệng há tròn có lưỡi hồng, thân vươn cao
  yawn(i) {
    const f = faceOf(cells[i]), r = f.art ? 4.2 : 5.5;
    idleAct(i, 'idle-yawn', 1550, coverEyes(f) + coverMouth(f) + shutEyes(f, 4)
      + `<g class="yawnmouth"><ellipse cx="${f.mx}" cy="${f.my + r}" rx="${r}" ry="${r * 1.2}" fill="#6b1420" stroke="${f.ink}" stroke-width="1.2"/>
        <ellipse cx="${f.mx}" cy="${f.my + r * 1.75}" rx="${r * .6}" ry="${r * .45}" fill="#ff8fb5"/></g>`);
  },
  stretch(i) { idleAct(i, 'idle-stretch', 1150); },
  // Dụi nhau: hai con kề nhau cùng nghiêng vào nhau, nhắm mắt thư thái, một trái tim bay lên giữa hai con
  nuzzle(i) {
    const pals = Object.keys(DIRS).map(d => [d, step(level, i, d)]).filter(([, j]) => j >= 0 && isCat(j) && !cellG(j).dataset.idle);
    if (!pals.length) return idle.look(i);
    const [d, j] = pals[Math.floor(Math.random() * pals.length)], [dx, dy] = LOOK[d];
    for (const [k, s] of [[i, 1], [j, -1]]) {
      const g = cellG(k), f = faceOf(cells[k]);
      g.style.setProperty('--px', `${dx * s * 5}px`);
      g.style.setProperty('--py', `${dy * s * 4}px`);
      g.style.setProperty('--rot', `${dx * s * 8}deg`);
      idleAct(k, 'idle-nuzzle', 1750, coverEyes(f) + shutEyes(f, 4));
    }
    const [x1, y1] = pos(i), [x2, y2] = pos(j), el = document.createElementNS(NS, 'g');
    el.setAttribute('transform', `translate(${(x1 + x2) / 2 + SZ / 2} ${(y1 + y2) / 2 + SZ / 2 - 30}) scale(1.5)`);
    el.innerHTML = '<path class="heart-up" d="M0 4 C-7 -2 -7 -9 -2.5 -9 C-1 -9 0 -7.5 0 -6.5 C0 -7.5 1 -9 2.5 -9 C7 -9 7 -2 0 4 Z" fill="#ff7eb6" stroke="#b5306f" stroke-width="1.2"/>';
    setTimeout(() => { overlay.appendChild(el); setTimeout(() => el.remove(), 1350); }, 350);
  },
};

// Chạm (không vuốt) vào một con mèo: nảy lên, nhắm mắt cười, kêu meo khẽ
function pet(i) {
  if (!isCat(i) || cellG(i).dataset.idle && cellG(i).classList.contains('idle-pet')) return;
  stopIdleAt(i);
  const f = faceOf(cells[i]);
  idleAct(i, 'idle-pet', 520, coverEyes(f) + shutEyes(f, 4));
  sfx.pet(cells[i].color);
}
function stopIdleAt(i) {
  const g = cellG(i);
  if (!g) return;
  for (const el of g.querySelectorAll('.idlefx')) el.remove();
  g.classList.remove(...IDLE);
  delete g.dataset.idle;
}

setInterval(() => {
  if (screen !== 'game' || !level || busy || gesture || mode || solved || lost || document.hidden || calm.matches) return;
  if (Math.random() < .3) return;
  const free = freeCats();
  if (!free.length) return;
  const i = free[Math.floor(Math.random() * free.length)], r = Math.random();
  (r < .34 ? idle.blink : r < .56 ? idle.look : r < .68 ? idle.turn : r < .79 ? idle.yawn : r < .9 ? idle.stretch : idle.nuzzle)(i);
}, 1300);

// Đếm tế bào từng loài theo những gì đang hiện trên bàn; vi khuẩn và virus đếm riêng.
function renderSpecies() {
  const count = col => shown.filter(c => c && c.color === col).length;
  let out = level.colors.map(col => {
    const n = count(col);
    return `<span class="${n === 0 ? 'gone' : n === 1 ? 'low' : ''}" title="Mèo ${NAMES[col]}">${icon(col)}${n}</span>`;
  }).join('');
  if (level.kill) out += `<span class="enemy" title="Vi khuẩn cần diệt">${icon('G')}${count('G')}</span>`;
  if (hasVirus(level)) out += `<span class="enemy" title="Virus">${icon('V')}${count('V')}</span>`;
  $('species').innerHTML = out;
}

function renderBoosters() {
  const idle = !busy && !solved && !lost && !outOfHearts() && !tutStep();
  for (const kind in BOOSTER_NAMES) {
    const n = save.boosters[kind], badge = $('b-' + kind).querySelector('.badge');
    badge.textContent = n || '+';
    badge.classList.toggle('plus', !n);
    $('b-' + kind).classList.toggle('on', !!mode && mode.kind === kind);
  }
  $('b-mutate').disabled = !idle || (level.colors.length < 2 && !level.kill);
  $('b-clone').disabled = !idle;
  $('b-revive').disabled = !lost || busy;
  $('lostRevive').textContent = `✨ Hồi sinh (${save.boosters.revive})`;
  $('lostRevive').disabled = !save.boosters.revive;
}

function update() {
  const wasSolved = solved, wasLost = lost;
  solved = !busy && isWon(level, cells);
  lost = !busy && isLost(level, cells);
  const par = parCache.has(index) ? parCache.get(index).par : null;   // chưa tính xong thì chưa hiện mốc sao
  $('moves').textContent = `👣 ${movesNow()}` + (par ? ` · 3⭐ ≤ ${par}` : '');
  $('undo').disabled = history.length === 0 || busy || lost;
  $('hint').disabled = busy || solved || lost;
  $('solved').classList.toggle('show', solved);
  $('lost').classList.toggle('show', lost);
  if (lost) $('lostText').textContent = `😢 Hết sạch mèo ${extinct(level, cells).map(c => NAMES[c]).join(', ')}: ` +
    (save.hearts ? 'mất 1 tim' : 'mất 1 tim, đã hết tim');
  // Vòng mục tiêu: vòng nào vừa đạt thì loé sáng
  const ok = new Set();
  for (const el of board.querySelectorAll('.ring')) {
    const i = +el.dataset.i, hit = !!shown[i] && shown[i].color === level.target[i];
    el.classList.toggle('ok', hit);
    if (hit) ok.add(i);
  }
  for (const i of ok) if (!ringsOk.has(i)) { fx.sparkle(i, COLORS[level.target[i]][0], 10); fx.ring(i, '#ffffff', .6); sfx.ding(); }
  ringsOk = ok;
  // Mèo mắt sao: khi đang nằm đúng hộp của mình, và cả bàn khi thắng
  shown.forEach((c, i) => {
    const img = c && CAT[c.color] && nodes.get(c.id)?.querySelector('.cat');
    if (!img) return;
    const src = catSrc(c.color, solved || ok.has(i));
    if (img.getAttribute('href') !== src) img.setAttribute('href', src);
  });
  if (solved && !wasSolved) celebrate();
  if (lost && !wasLost) mourn();
  if (!lost) { layer.classList.remove('sad'); for (const f of layer.querySelectorAll('.sadface')) f.remove(); for (const g of layer.querySelectorAll('.sorry')) g.classList.remove('sorry'); }
  renderSpecies();
  renderTasks();
  renderBoosters();
  renderClock();
  renderCoach();
}

// Ghi kết quả thắng: sao theo số lần vuốt so với tối ưu, giữ kết quả tốt nhất; mỗi sao 10 xu.
// Bảng thắng hiện sao bay vào, rồi xu bay từ bảng lên ô đếm xu.
const COINS_PER_STAR = 10;
function recordWin() {
  const moves = movesNow(), par = parOf(index), stars = starsFor(moves, par), prev = record(index);
  const better = !prev || stars > prev.stars || moves < prev.best;
  save.prog[levelKey(index)] = { stars: Math.max(stars, prev ? prev.stars : 0), best: prev ? Math.min(moves, prev.best) : moves };
  const reward = stars * COINS_PER_STAR;
  save.coins += reward;
  persist();
  freshWin = index;
  $('winStars').innerHTML = [1, 2, 3].map(k => `<span class="${k <= stars ? 'on' : ''}" style="animation-delay:${.2 + .18 * k}s">★</span>`).join('');
  $('solvedStats').textContent = `${moves} lần vuốt · tối ưu ${par}` + (prev && better ? ' · kỷ lục mới!' : '');
  $('rewardText').textContent = `+${reward}`;
  setTimeout(() => flyCoins(reward), 900);
  $('continue').textContent = index < LEVELS.length - 1 ? 'Tiếp tục ›' : 'Về bản đồ';
  $('next').disabled = index === LEVELS.length - 1;
}

// Xu bay từ bảng thắng lên ô đếm xu theo đường cong; mỗi đồng chạm tới thì cộng dần, kêu "ting" cao dần và ô đếm nảy lên.
function flyCoins(amount) {
  const target = $(screen === 'game' ? 'coins' : 'homeCoins'), from = $('reward').getBoundingClientRect(), to = target.getBoundingClientRect();
  const n = Math.max(4, Math.round(amount / COINS_PER_STAR) * 4), per = amount / n;
  const sx = from.left + from.width / 2, sy = from.top + from.height / 2, dx = to.left + 14 - sx, dy = to.top + to.height / 2 - sy;
  let got = 0, base = save.coins - amount;
  for (let k = 0; k < n; k++) {
    const el = document.createElement('i');
    el.className = 'coin';
    el.style.left = `${sx}px`;
    el.style.top = `${sy}px`;
    $('flyLayer').appendChild(el);
    const pop = [(Math.random() - .5) * 110, -30 - Math.random() * 50];
    const mid = [dx * .35 + (Math.random() - .5) * 140, dy * .35 - 30 - Math.random() * 50];
    const a = el.animate([
      { transform: 'translate(0, 0) scale(.3)', opacity: 0 },
      { transform: `translate(${pop[0]}px, ${pop[1]}px) scale(1.2)`, opacity: 1, offset: .22 },
      { transform: `translate(${mid[0]}px, ${mid[1]}px) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(${dx}px, ${dy}px) scale(.6)`, opacity: 1 },
    ], { duration: 950, delay: k * 70, easing: 'cubic-bezier(.5, 0, .75, 1)', fill: 'backwards' });
    a.onfinish = () => {
      if (!el.isConnected) return;
      el.remove();
      got++;
      coinShown = got === n ? save.coins : Math.round(base + per * got);
      renderCoins();
      jolt(target, 'bump');
      if (got === n) sfx.cashout(); else sfx.coin(got);
    };
  }
  // Dự phòng: hiệu ứng không chạy (trang bị ẩn, máy tạm dừng vẽ) thì hết thời gian bay vẫn cộng đủ xu
  setTimeout(() => {
    if (got === n) return;
    for (const el of $('flyLayer').querySelectorAll('.coin')) el.remove();
    got = n;
    coinShown = save.coins;
    renderCoins();
  }, 950 + n * 70 + 400);
}

function renderCoins() {
  for (const id of ['coins', 'homeCoins']) $(id).querySelector('b').textContent = coinShown;
}

function celebrate() {
  recordWin();
  layer.classList.add('happy');
  setTimeout(() => layer.classList.remove('happy'), 1500);
  fx.confetti();
  sfx.win();
  buzz([20, 40, 20]);
}

function mourn() {
  layer.classList.add('sad');
  for (const c of cells) {
    const lean = c && !c.sleep && level.colors.includes(c.color) && nodes.get(c.id)?.querySelector('.lean');   // mèo ngủ đã bịt mắt
    if (lean && !lean.querySelector('.sadface')) { lean.insertAdjacentHTML('beforeend', sadFace(c)); nodes.get(c.id).classList.add('sorry'); }
  }
  jolt(stage, 'shake');
  sfx.lose();
  buzz(60);
}

// Áp một nước (vuốt hoặc booster) theo từng chặng có hiệu ứng: bản sao mọc ra và dãy trượt, tế bào bị thay thế vỡ,
// ô độc bốc khói, bộ 3 nổ tung, virus lan và ăn tế bào, tế bào ngủ thức dậy. Thua thì trừ 1 tim.
async function commit(res, spent = null, info = {}) {
  stopIdle();
  nextId = res.nextId;
  history.push({ cells, spent });
  const before = cells;
  cells = res.cells;
  overlay.innerHTML = '';
  busy = true;
  const bornAt = res.moved.findIndex(c => c && c.id === res.born[0]);
  const gone = info.gone ? [info.gone] : res.replaced ? [res.replaced] : [];
  sync(res.moved, new Map([res.born]), gone);
  if (info.dir) {
    const parent = nodes.get(before[info.from].id);
    if (parent) jolt(parent.querySelector('.body'), info.dir === 'left' || info.dir === 'right' ? 'sq-x' : 'sq-y');
    sfx.divide(before[info.from].color);
    buzz(8);
  }
  if (info.meow) sfx.divide(info.meow);
  if (info.mutated) nodes.get(res.born[0])?.classList.add('mutated');
  if (res.pushed) sfx.push();
  if (info.dir && res.pushed) {
    // Con mẹ chồm tới; cả dãy bị đẩy dồn lại rồi nảy về, con càng xa càng nảy sau
    act(before[info.from].id, 'shove', info.dir, 7, 0, .9);
    let k = 0;
    for (let i = step(level, info.from, info.dir); i >= 0 && before[i]; i = step(level, i, info.dir)) act(before[i].id, 'pushed', info.dir, 6, .1 + .05 * k++);
    // Mèo đang đứng đúng hộp mà bị đẩy ra khỏi hộp: choáng
    if (level.hasTarget) res.moved.forEach((c, now) => {
      const was = c ? before.indexOf(c) : -1;
      if (was >= 0 && was !== now && level.target[was] === c.color && level.target[now] !== c.color) setTimeout(() => dizzy(c.id), 230);
    });
  }
  if (gone.length) { pop(gone); fx.burst(bornAt, COLORS[gone[0].color][0], 9); sfx.replace(); }
  if (res.removed.length) {
    await wait(220);
    pop(res.removed);
    const poisoned = res.removed.filter(c => level.toxic[slotOf(res.moved, c)]);
    const cleared = res.removed.filter(c => !poisoned.includes(c));
    for (const c of poisoned) { const i = slotOf(res.moved, c); fx.smoke(i); if (level.colors.includes(c.color)) ghost(i, c); }
    if (poisoned.length) sfx.toxic();
    for (const c of cleared) { const i = slotOf(res.moved, c); fx.burst(i, COLORS[c.color][0]); fx.ring(i, COLORS[c.color][0]); }
    if (cleared.length) {
      sfx.clear(cleared.length);
      jolt(stage, 'shake');
      buzz(25);
      fx.text(slotOf(res.moved, cleared[1] || cleared[0]), cleared.length > 3 ? `Khử ${cleared.length}!` : 'Khử 3!', '#ffe27a');
    }
    await wait(330);
  }
  sync(res.cleared);
  if (res.spread.length) {
    await wait(res.removed.length ? 80 : 240);
    if (res.eaten.length) {
      // Virus chồm tới, hàm răng đớp, con mồi tím tái rồi bị nuốt; xong mới hiện virus mới ở ô đó
      for (const [, from] of res.spread) { const v = res.cleared[from]; if (v) act(v.id, 'lunge', v.dir, 12); }
      for (const c of res.eaten) { chomp(slotOf(res.cleared, c)); act(c.id, 'eaten'); }
      sfx.eat();
      buzz(18);
      await wait(300);
    }
    sync(res.infected, new Map(res.spread), res.eaten);
    for (const c of res.eaten) fx.splat(slotOf(res.cleared, c));
    if (!res.eaten.length) sfx.push();
    await wait(res.eaten.length ? 260 : 340);
  }
  if (res.poisoned.length) {
    pop(res.poisoned);
    for (const c of res.poisoned) { const i = slotOf(res.infected, c); fx.smoke(i); if (level.colors.includes(c.color)) ghost(i, c); }
    sfx.toxic();
    await wait(330);
  }
  busy = false;
  const woke = res.cells.map((c, i) => c && !c.sleep && res.infected[i] && res.infected[i].sleep ? i : -1).filter(i => i >= 0);
  sync(cells);
  if (woke.length) { for (const i of woke) fx.sparkle(i, '#fff6b0', 10); sfx.wake(cells[woke[0]].color); }
  if (isLost(level, cells)) {
    setHearts(save.hearts - 1);
    renderHearts(save.hearts);
  }
  update();
}

function play(from, dir) {
  if (busy || solved || lost || mode || outOfHearts()) return;
  const t = tutStep();
  if (t && (from !== t.from || dir !== t.dir)) { refuse(from, 'Vuốt theo hướng ngón tay chỉ nhé 👆'); return; }
  const res = swipe(level, cells, from, dir, nextId);
  if (!res) { refuse(from, 'Không có gì thay đổi'); return; }
  commit(res, null, { from, dir });
}

// Chạm vào thứ không vuốt được: tế bào lắc đầu, kêu "bụp"
function refuse(i, msg) {
  const c = cells[i], g = c && nodes.get(c.id);
  if (g) jolt(g, 'nope');
  if (c && c.color === 'V') sfx.grumble();
  else if (c && c.color === level.kill) sfx.squish();
  else sfx.nope();
  toast(msg);
}

function restore(state) {
  stopIdle();
  cells = state;
  if (mode) { mode = null; toast('', 0); }
  overlay.innerHTML = '';
  sync(cells);
  ringsOk = new Set(level.target.map((t, k) => t && cells[k] && cells[k].color === t ? k : -1).filter(k => k >= 0));
  update();
}

// ---------------------------------------------------------------------------
// Booster: Đột biến và Cấy ghép chọn trên bàn; Hồi sinh chỉ dùng được khi vừa thua
// ---------------------------------------------------------------------------
function modeHint() {
  if (mode.kind === 'mutate') return mode.cell == null ? '🧬 Chạm con mèo muốn đổi màu' : '🧬 Chọn màu mới cho mèo';
  return mode.from == null ? '💉 Chọn con mèo để nhân bản' : '💉 Chạm một ô trống bất kỳ để cấy bản sao vào';
}

function setMode(m) {
  mode = m;
  drawMode();
  update();
}

function drawMode() {
  overlay.innerHTML = '';
  if (!mode) { toast('', 0); return; }
  const mark = (i, cls = 'mark') => { const [x, y] = pos(i); return `<circle class="${cls}" cx="${x + SZ / 2}" cy="${y + SZ / 2}" r="42"/>`; };
  let out = '';
  if (mode.kind === 'mutate' && mode.cell != null) {
    // Bảng chọn màu đè lên chính tế bào đã chọn
    const [x, y] = pos(mode.cell);
    const others = level.colors.filter(col => col !== cells[mode.cell].color);
    out += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="#10206b" opacity=".82"/>`;
    // Tối đa 2 màu thì xếp một hàng, nhiều hơn thì lưới 2 cột cho khỏi tràn ra ngoài ô
    const cols = Math.min(2, others.length), rows = Math.ceil(others.length / cols);
    others.forEach((col, k) => {
      const cx = x + (k % cols - (cols - 1) / 2) * 42, cy = y + (Math.floor(k / cols) - (rows - 1) / 2) * 42;
      out += `<g class="pick" data-pick="${col}" transform="translate(${cx + SZ * .22} ${cy + SZ * .22}) scale(.56)">${cellBody({ color: col, id: 1 })}</g>`;
    });
  } else if (mode.kind === 'clone' && mode.from != null) {
    out += mark(mode.from, 'mark sel');
    level.slot.forEach((s, i) => { if (s && !level.toxic[i] && !cells[i]) out += mark(i); });
  } else {
    cells.forEach((c, i) => { if (c && c.color !== 'V') out += mark(i); });
  }
  overlay.innerHTML = out;
  toast(modeHint(), 0);
}

// Dùng booster: nút nảy, hiệu ứng riêng cho từng loại rồi mới áp nước đi.
async function useBooster(kind, res, info = {}) {
  if (!res) return;
  save.boosters[kind]--;
  persist();
  mode = null;
  toast('', 0);
  overlay.innerHTML = '';
  jolt($('b-' + kind), 'fire');
  sfx.booster();
  buzz(15);
  if (kind === 'mutate') fx.rainbow(info.at);
  if (kind === 'clone') {
    busy = true;
    info.meow = cells[info.from].color;          // bản sao cấy xong cũng kêu
    fx.trail(info.from, info.at, COLORS[info.meow][0]);
    await wait(300);
  }
  commit(res, kind, info);
}

function onModeTap(ev) {
  const pick = ev.target.closest('[data-pick]');
  const i = slotAt(toBoard(ev));
  if (i >= 0 && cells[i] && cells[i].color === 'V') { refuse(i, 'Booster không dùng được lên virus'); return; }
  if (mode.kind === 'mutate') {
    if (pick) {
      const at = mode.cell;
      useBooster('mutate', mutate(level, cells, at, pick.dataset.pick, nextId), { at, gone: cells[at], mutated: true });
      return;
    }
    if (i < 0 || !cells[i]) return;
    const col = cells[i].color;
    if (level.colors.includes(col) && cells.filter(c => c && c.color === col).length === 1) { refuse(i, `Không thể đổi con mèo ${NAMES[col]} cuối cùng`); return; }
    const others = level.colors.filter(o => o !== col);
    if (!others.length) { refuse(i, 'Không có màu khác để đổi'); return; }
    sfx.tap();
    if (others.length === 1) { useBooster('mutate', mutate(level, cells, i, others[0], nextId), { at: i, gone: cells[i], mutated: true }); return; }
    mode.cell = i;
    drawMode();
    return;
  }
  if (i >= 0 && cells[i]) { sfx.tap(); mode.from = i; drawMode(); return; }
  if (mode.from == null || i < 0 || !level.slot[i]) return;
  if (level.toxic[i]) { sfx.nope(); toast('Không cấy vào ô độc được'); return; }
  useBooster('clone', transplant(level, cells, mode.from, i, nextId), { from: mode.from, at: i });
}

function revive() {
  if (!lost || busy) return;
  if (!save.boosters.revive) { sfx.nope(); toast('Hết Hồi sinh: bấm "Nạp lại tim và booster" ở dưới cùng'); return; }
  const h = history.pop();
  save.boosters.revive--;
  if (h.spent) save.boosters[h.spent]++;
  setHearts(save.hearts + 1);
  renderHearts(save.hearts - 1, 'gain');
  restore(h.cells);
  jolt($('b-revive'), 'fire');
  jolt(stage, 'flash');
  fx.glow();
  sfx.revive();
  buzz([15, 30, 15]);
  toast('✨ Hồi sinh: đã quay lại trước nước thua và trả lại tim');
}

// ---------------------------------------------------------------------------
// Thẻ hướng dẫn và chọn level
// ---------------------------------------------------------------------------
let learnQueue = [], learnPos = 0, learnFresh = false;

function showLearn(list, fresh) {
  learnQueue = list;
  learnPos = 0;
  learnFresh = fresh;
  renderLearn();
  $('learn').classList.add('show');
  sfx.open();
}

function renderLearn() {
  const m = learnQueue[learnPos];
  $('learnTag').textContent = !learnFresh ? 'Luật chơi' : m.fresh ? 'Cơ chế mới' : 'Cách chơi';
  $('learnTag').classList.toggle('plain', !learnFresh || !m.fresh);
  $('learnStep').textContent = learnQueue.length > 1 ? `${learnPos + 1}/${learnQueue.length}` : '';
  $('learnTitle').textContent = `${m.icon} ${m.title}`;
  $('learnDemo').innerHTML = m.demos.map(d => {
    const lv = parseLevel(d.def);
    const res = swipe(lv, lv.init, d.from, d.dir);
    return `<div class="demo">${boardSvg(lv, lv.init, d.from, d.dir)}<b>➜</b>${boardSvg(lv, res.cells)}</div>` +
      (d.cap ? `<p class="demo-cap">${d.cap}</p>` : '');
  }).join('');
  $('learnPoints').innerHTML = m.points.map(p => `<li>${p}</li>`).join('');
  $('learnOk').textContent = learnPos < learnQueue.length - 1 ? 'Tiếp ›' : learnFresh ? 'Đã hiểu, chơi thôi!' : 'Đóng';
  // Thẻ mới lật ra thì nảy lên lại
  jolt($('learn').querySelector('.card'), 'card');
}

$('learnOk').onclick = () => {
  const m = learnQueue[learnPos];
  sfx.tap();
  if (!save.seen.includes(m.key)) { save.seen.push(m.key); persist(); }
  if (++learnPos < learnQueue.length) renderLearn();
  else { $('learn').classList.remove('show'); sfx.close(); }
};
$('rules').onclick = () => { sfx.tap(); showLearn(MECHANICS.filter(m => m.has(level, index)), false); };

// ---------------------------------------------------------------------------
// Màn tổng quan: tiến độ chung, nút chơi tiếp, các chương với con đường qua từng level
// ---------------------------------------------------------------------------
function showHome() {
  screen = 'home';
  mode = null;
  gesture = null;
  $('app').hidden = true;
  $('home').hidden = false;
  for (const id of ['solved', 'lost', 'learn', 'nohearts']) $(id).classList.remove('show');
  fx.clear();
  $('coach').hidden = true;
  renderHome();
  renderHearts();
  renderCoins();
  renderClock();
  const focus = document.querySelector('.node.fresh') || document.querySelector('.node.cur');
  if (focus) focus.scrollIntoView({ block: 'center' });
  freshWin = -1;
}

function enterLevel(i) {
  screen = 'game';
  $('home').hidden = true;
  $('app').hidden = false;
  window.scrollTo(0, 0);
  load(i);
}

function renderHome() {
  const n = LEVELS.length, done = LEVELS.filter((_, i) => isDone(i)).length;
  const stars = LEVELS.reduce((s, _, i) => s + starsOf(i), 0), nx = nextLevel();
  $('homeStars').textContent = `⭐ ${stars}/${n * 3}`;
  $('overallText').textContent = `Đã qua ${done}/${n} level`;
  $('overallStars').textContent = `${Math.round(done / n * 100)}%`;
  $('overallBar').style.width = `${done / n * 100}%`;
  $('playNext').innerHTML = nx < 0 ? '🏆 Đã qua hết!<small>Chơi lại để gom đủ 3 sao</small>'
    : `▶ ${done ? 'Chơi tiếp' : 'Bắt đầu'}<small>Level ${nx + 1}</small>`;
  $('chapters').innerHTML = mapHtml(nx);
  $('unlockAll').textContent = save.unlockAll ? 'Khoá lại theo thứ tự (bản thử)' : 'Mở khoá tất cả level (bản thử)';
  $('unlockAll').hidden = !LOCK_IN_ORDER;
}

// Mọi level trên một con đường liền (không chia chương), xếp kiểu rắn bò, 4 nút một hàng: hàng chẵn trái sang phải,
// hàng lẻ ngược lại. Con đường mờ nối mọi nút; đoạn chấm vàng là quãng đã đi tới.
function mapHtml(nx) {
  const ids = LEVELS.map((_, i) => i);
  const rows = Math.ceil(ids.length / 4);
  const cellOf = j => { const r = Math.floor(j / 4); return [r, r % 2 ? 3 - j % 4 : j % 4]; };
  const pts = ids.map((_, j) => { const [r, c] = cellOf(j); return `${c * 100 + 50},${r * 100 + 50}`; });
  const reached = ids.reduce((far, i, j) => isDone(i) || i === nx ? j + 1 : far, 0);
  const nodes = ids.map((i, j) => {
    const [r, c] = cellOf(j);
    const state = isDone(i) ? 'done' : !unlocked(i) ? 'lock' : i === nx ? 'cur' : '';
    const badge = newIcons(i);
    return `<button class="node ${state}${i === freshWin ? ' fresh' : ''}" data-level="${i}" style="grid-row:${r + 1};grid-column:${c + 1}" aria-label="Level ${i + 1}">` +
      (state === 'lock' ? (catArt ? `<img class="padlock" src="${ART}ui/Icon_Padlock.png" alt="">` : '🔒') : i + 1) +
      (isDone(i) ? `<span class="stars">${starRow(starsOf(i))}</span>` : '') +
      (badge ? `<span class="new">${badge}</span>` : '') +
      (state === 'cur' ? `<svg class="marker" viewBox="-6 -10 102 108">${cellBody({ color: 'A', id: 3 })}</svg>` : '') + '</button>';
  }).join('');
  return `<section class="chapter">
    <div class="path" style="grid-template-rows:repeat(${rows}, 112px)">
      <svg class="roads" viewBox="0 0 400 ${rows * 100}" preserveAspectRatio="none"><polyline class="road" points="${pts.join(' ')}"/>` +
      (reached > 1 ? `<polyline class="road walked" points="${pts.slice(0, reached).join(' ')}"/>` : '') + `</svg>
      ${nodes}</div></section>`;
}

// Thẻ chi tiết level: ảnh thu nhỏ của bàn, mục tiêu, cơ chế, kỷ lục và mốc 3 sao.
function openSheet(i) {
  const lv = parseLevel(LEVELS[i]), d = record(i), par = parOf(i), news = newLabels(i);
  $('shChapter').textContent = news.map(l => `${l.icon} ${l.text}`).join(' · ');
  $('shChapter').hidden = !news.length;
  $('shTitle').textContent = `Level ${i + 1}`;
  $('shPreview').innerHTML = boardSvg(lv, lv.init);
  $('shGoal').textContent = goalOf(lv);
  $('shMechs').innerHTML = MECHANICS.filter(m => (m.fresh || m.key === 'target') && m.has(lv, i)).map(m => `<span>${m.icon} ${m.title}</span>`).join('')
    || '<span>👆 Chia · đẩy · thay thế · khử 3</span>';
  $('shRecord').innerHTML = d ? `<span class="stars">${starRow(d.stars)}</span><span>Kỷ lục ${d.best} lần vuốt · 3⭐ khi ≤ ${par}</span>`
    : `<span>Chưa qua · xong trong ${par} lần vuốt để được 3⭐</span>`;
  const open = unlocked(i);
  $('shPlay').disabled = !open;
  $('shPlay').textContent = !open ? `🔒 Qua level ${i} để mở` : d ? 'Chơi lại ▶' : 'Chơi ▶';
  $('shPlay').onclick = () => { sfx.tap(); $('sheet').classList.remove('show'); enterLevel(i); };
  $('sheet').classList.add('show');
  sfx.open();
}

$('chapters').onclick = ev => {
  const b = ev.target.closest('[data-level]');
  if (!b) return;
  sfx.tap();
  openSheet(+b.dataset.level);
};
$('shClose').onclick = () => { $('sheet').classList.remove('show'); sfx.close(); };
$('playNext').onclick = () => {
  sfx.tap();
  const nx = nextLevel();
  enterLevel(nx >= 0 ? nx : Math.max(0, LEVELS.findIndex((_, i) => starsOf(i) < 3)));
};
$('unlockAll').onclick = () => { save.unlockAll = !save.unlockAll; persist(); sfx.tap(); renderHome(); };
$('wipe').onclick = () => {
  if (!confirm('Xoá toàn bộ sao, tiến độ và hướng dẫn đã xem?')) return;
  save.prog = {};
  save.seen = [];
  persist();
  renderHome();
};

// ---------------------------------------------------------------------------
// Thao tác: nhấn vào tế bào rồi vuốt; mắt tế bào nhìn theo và mũi tên xem trước hướng sẽ chia
// ---------------------------------------------------------------------------
function toBoard(ev) {
  const p = board.createSVGPoint();
  p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(board.getScreenCTM().inverse());
}

function slotAt(pt) {
  const c = Math.floor(pt.x / SZ), r = Math.floor(pt.y / SZ);
  return r < 0 || c < 0 || r >= level.h || c >= level.w ? -1 : r * level.w + c;
}

function dirOf(dx, dy) {
  if (Math.hypot(dx, dy) < SZ * 0.3) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

function drawArrow(from, dir) {
  overlay.innerHTML = dir ? arrowSvg(level, from, dir) : '';
}

// Kẹo dẻo đảo mắt, mèo nghiêng người về hướng sắp chia
function lookAt(i, dir) {
  const node = cells[i] && nodes.get(cells[i].id);
  if (!node) return;
  const [dx, dy] = dir ? LOOK[dir] : [0, 0];
  const look = node.querySelector('.look'), lean = node.querySelector('.lean');
  if (look) look.style.transform = dir ? `translate(${dx * 3}px, ${dy * 3}px)` : '';
  if (lean) lean.style.transform = dir ? `translate(${dx * 5}px, ${dy * 5}px) rotate(${dx * 9}deg)` : '';
}

board.addEventListener('pointerdown', ev => {
  if (busy || solved || lost || outOfHearts()) return;
  if (mode) { onModeTap(ev); return; }
  const pt = toBoard(ev);
  const i = slotAt(pt);
  if (i < 0 || !cells[i]) return;
  const t = tutStep();
  if (t && i !== t.from) { refuse(i, 'Làm theo ngón tay chỉ nhé 👆'); return; }
  if (cells[i].color === 'V') { refuse(i, 'Virus không vuốt được'); return; }
  if (cells[i].sleep) {
    const col = NAMES[cells[i].color];
    refuse(i, `Mèo ${col} đang ngủ: đưa một mèo ${col} tới đứng cạnh để đánh thức`);
    return;
  }
  sfx.tap();
  stopIdleAt(i);                                     // để con này nghiêng theo tay vuốt, không bị động tác rảnh đè
  gesture = { from: i, x: pt.x, y: pt.y, dir: null };
  try { board.setPointerCapture(ev.pointerId); } catch (e) { /* con trỏ đã nhả trước khi bắt */ }
});

board.addEventListener('pointermove', ev => {
  if (!gesture) return;
  const pt = toBoard(ev);
  const dir = dirOf(pt.x - gesture.x, pt.y - gesture.y);
  if (dir !== gesture.dir) { gesture.dir = dir; drawArrow(gesture.from, dir); lookAt(gesture.from, dir); }
});

board.addEventListener('pointerup', () => {
  if (!gesture) return;
  const { from, dir } = gesture;
  gesture = null;
  overlay.innerHTML = '';
  lookAt(from, null);
  if (dir) play(from, dir);
  else pet(from);                                    // chạm mà không vuốt: vuốt ve
});
board.addEventListener('pointercancel', () => { if (gesture) lookAt(gesture.from, null); gesture = null; overlay.innerHTML = ''; });

let toastTimer;
// ms = 0 giữ thông báo tới khi bị thay; hết giờ thì quay về hướng dẫn của booster đang chọn (nếu có).
function toast(msg, ms = 2400) {
  $('toast').textContent = msg;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { $('toast').textContent = mode ? modeHint() : ''; }, ms);
}

$('undo').onclick = () => {
  if (busy || lost || !history.length) return;
  sfx.tap();
  const h = history.pop();
  restore(h.cells);
  if (h.spent) {
    save.boosters[h.spent]++;
    persist();
    update();
    toast(`Đã trả lại booster ${BOOSTER_NAMES[h.spent]}`);
  }
};
$('reset').onclick = $('lostReset').onclick = () => {
  if (busy) return;
  sfx.tap();
  if (lost) { load(index); return; }          // sau khi thua thì chơi lại từ đầu, không hoàn tác về ván thua
  if (keyOf(cells) === keyOf(level.init)) return;
  history.push({ cells, spent: null, reset: true });
  restore(level.init.slice());
};
$('hint').onclick = () => {
  if (busy || solved || lost) return;
  if (tutStep()) { toast('Làm theo ngón tay trước nhé 👆'); return; }
  if (mode) setMode(null);
  // Còn đi đúng lời giải đã tính thì lấy luôn phần còn lại; lệch thì giải lại, tối đa 0,6 giây cho bàn lớn
  const sol = solutionOf(index), at = sol.path ? sol.keys.indexOf(keyOf(cells)) : -1;
  const path = at >= 0 ? sol.path.slice(at) : solve(level, cells, 80000, 600);
  if (!path) {
    sfx.nope();
    // Không giải được từ đây: chỉ cách hoàn tác về thế cờ gần nhất còn nằm trên lời giải đã biết
    let back = 0;
    for (let k = history.length - 1; k >= 0 && !history[k].reset; k--) {
      if (sol.keys.includes(keyOf(history[k].cells))) { back = history.length - k; break; }
    }
    toast(back ? `${solve.cut ? 'Đi lệch đường thắng rồi' : 'Từ đây không thắng được nữa'}: hoàn tác ${back} bước rồi bấm Gợi ý lại nhé.`
      : solve.cut ? 'Thế cờ này rối quá, chưa tìm ra gợi ý. Thử hoàn tác vài bước nhé.' : 'Từ đây không thắng được nữa, hãy hoàn tác.');
    return;
  }
  sfx.ding();
  drawArrow(path[0][0], path[0][1]);
  lookAt(path[0][0], path[0][1]);
  toast(`💡 Thử vuốt theo mũi tên · còn ít nhất ${path.length} lần vuốt`);
  setTimeout(() => { if (!gesture && !mode) { overlay.innerHTML = ''; lookAt(path[0][0], null); } }, 2500);
};
for (const kind of ['mutate', 'clone']) $('b-' + kind).onclick = () => {
  if (mode && mode.kind === kind) { sfx.tap(); setMode(null); return; }
  if (busy || solved || lost) return;
  if (!save.boosters[kind]) { sfx.nope(); toast('Hết booster: bấm "Nạp lại tim và booster" ở dưới cùng'); return; }
  sfx.tap();
  jolt($('b-' + kind), 'fire');
  setMode({ kind });
};
$('b-revive').onclick = $('lostRevive').onclick = revive;
$('refill').onclick = () => { setHearts(MAX_HEARTS); renderHearts(); update(); sfx.revive(); };
$('refillAll').onclick = () => {
  save.boosters = { ...START_BOOSTERS };
  setHearts(MAX_HEARTS);
  renderHearts();
  update();
  sfx.booster();
  toast('Đã nạp lại 3 tim và booster');
};
const renderMute = () => { $('mute').textContent = $('homeMute').textContent = save.muted ? '🔇' : '🔊'; };
$('mute').onclick = $('homeMute').onclick = () => { save.muted = !save.muted; persist(); renderMute(); sfx.tap(); sfx.music(!save.muted); };
// Nhạc nền chỉ phát được sau thao tác đầu tiên của người chơi
document.addEventListener('pointerdown', () => sfx.music(true), { once: true });

// Thư mục asset Shikacat không nằm trong git: thiếu ảnh thì vẽ lại toàn bộ bằng hình kẹo dẻo tự vẽ.
function useDrawnArt() {
  if (!catArt) return;
  catArt = false;
  renderHearts();
  if (screen === 'game') { buildBoard(); sync(cells); update(); } else renderHome();
}
// Tải trước mọi ảnh sẽ dùng: thiếu ảnh nào (kể cả khi trang mở ở chế độ xem tĩnh không đọc được thư mục con)
// thì chuyển hẳn sang hình tự vẽ ngay, thay vì để vài tế bào vô hình.
const ART_FILES = ['ui/Tile_Board.png', 'ui/Image_FishBones_Default.png', 'ui/Icon_Life.png', 'ui/Icon_Padlock.png',
  ...Object.values(CAT).flatMap(n => [`cats/Image_Cat_${n}.png`, `cats/Image_Cat_${n}EndGame.png`, `cats/Panel_Box_${n}.png`])];
for (const f of ART_FILES) {
  const probe = new Image();
  probe.onerror = useDrawnArt;
  probe.src = ART + f;
}
// Ảnh nào tải lỗi giữa chừng (mất file, máy chủ tắt) cũng chuyển hẳn sang hình tự vẽ, để không bao giờ có tế bào vô hình.
document.addEventListener('error', ev => {
  const el = ev.target;
  const src = el instanceof SVGImageElement ? el.getAttribute('href') : el instanceof HTMLImageElement ? el.getAttribute('src') : '';
  if (src && src.startsWith(ART)) useDrawnArt();
}, true);
$('toHome').onclick = $('title').onclick = $('toMap').onclick = () => { sfx.tap(); showHome(); };
$('next').onclick = () => { if (index < LEVELS.length - 1 && unlocked(index + 1)) { sfx.tap(); load(index + 1); } };
$('continue').onclick = () => {
  sfx.tap();
  if (index < LEVELS.length - 1 && unlocked(index + 1)) load(index + 1);
  else showHome();
};

renderMute();
regen();
setInterval(() => { if (regen()) { renderHearts(); if (screen === 'game') update(); } else renderClock(); }, 1000);
showHome();
</script>
