<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meowtosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* Chủ đề "phòng thí nghiệm kẹo dẻo": nền tím như nhìn qua kính hiển vi, tế bào là kẹo dẻo có mặt */
  :root { --bg1: #16308f; --bg2: #0a1450; --text: #fff6fb; --muted: #c6d4ff; --accent: #ff7eb6; --gold: #ffc53d; --gold-dark: #b86b00; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font-family: 'Baloo 2', system-ui, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none;
    overflow-x: hidden; }                     /* quầng sáng sau bàn chơi chìa ra ngoài lề, không để trang lắc ngang */
  /* Nền xanh của Shikacat; thiếu ảnh thì còn lớp gradient bên dưới */
  body { display: flex; justify-content: center;
    background: url(shikacat/ui/Background_Core.png) center / cover fixed, radial-gradient(120% 80% at 50% 28%, #2f5ee0 0%, var(--bg1) 48%, var(--bg2) 100%) fixed; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 12% 18%, rgba(255,255,255,.08) 0 13px, transparent 14px),
      radial-gradient(circle at 86% 12%, rgba(255,255,255,.06) 0 22px, transparent 23px),
      radial-gradient(circle at 80% 72%, rgba(255,255,255,.05) 0 30px, transparent 31px),
      radial-gradient(circle at 18% 84%, rgba(255,255,255,.06) 0 18px, transparent 19px),
      radial-gradient(circle at 92% 44%, rgba(255,255,255,.05) 0 9px, transparent 10px),
      radial-gradient(circle at 6% 52%, rgba(255,255,255,.05) 0 7px, transparent 8px);
    animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateY(-26px); } }
  .defs { position: absolute; width: 0; height: 0; }
  #app { position: relative; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 9px;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }

  header { display: flex; align-items: center; gap: 8px; }
  header h1 { flex: 1; margin: 0; text-align: center; cursor: pointer; line-height: 1; }
  .logo { display: inline-block; font-size: 30px; font-weight: 800; letter-spacing: .05em; color: #ffe27a;
    text-shadow: 0 2px 0 #ff9f1c, 0 4px 0 #b8560a, 0 7px 10px rgba(0,0,0,.35); }
  header small { display: block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .nav, .iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--gold); color: #fff; font: inherit; font-size: 22px; font-weight: 800;
    background: radial-gradient(circle at 35% 30%, #6fa3ff, #2a4fd0 65%); box-shadow: 0 3px 0 var(--gold-dark); cursor: pointer; line-height: 1; padding: 0; }
  .nav:active, .iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-dark); }
  .nav:disabled { opacity: .3; cursor: default; }
  .iconbtn { width: 34px; height: 34px; font-size: 15px; border-width: 2px; }

  .hud { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .hearts { font-size: 25px; letter-spacing: 2px; line-height: 1; }
  .hearts span { display: inline-block; color: #ff4d8d; text-shadow: 0 2px 0 #9e1846; }
  .hearts .empty { color: #3a4a8a; text-shadow: none; }
  .hearts img { display: inline-block; width: 27px; height: auto; margin-right: 2px; vertical-align: middle; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .hearts img.empty { filter: grayscale(1) brightness(.55); opacity: .55; }
  .hearts .hit { animation: hit .7s ease-out; }
  .hearts .gain { animation: gain .8s ease-out; }
  @keyframes hit { 30% { transform: scale(1.7) rotate(-12deg); color: #fff; } }
  @keyframes gain { 0% { transform: scale(.2); } 50% { transform: scale(1.6); color: #ffe27a; } }
  #regen { flex: 1; text-align: right; }

  .goalbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 18px;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.14); line-height: 1.25; }
  .goalbar span { flex: 1; }
  .goalbar b { font-size: 15.5px; }
  .goalbar small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  /* Bảng nhiệm vụ: mỗi điều kiện thắng một ô nhỏ, đạt thì chuyển xanh */
  .tasks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tasks span { padding: 1px 9px; border-radius: 99px; background: rgba(0,0,0,.28); color: var(--text); font-size: 12.5px; font-weight: 700;
    font-variant-numeric: tabular-nums; transition: background .25s; }
  .tasks .ok { background: #23a447; }
  .goalbar button { border: 0; border-radius: 14px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 800; color: #5a2a00; cursor: pointer;
    background: linear-gradient(#fff3a6, #ffc53d); box-shadow: 0 3px 0 var(--gold-dark); white-space: nowrap; }

  .stage { position: relative; }
  .stage::before { content: ''; position: absolute; inset: -4% -6%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,210,236,.24), rgba(255,210,236,.07) 72%, transparent); }
  #board { position: relative; width: 100%; max-height: 48vh; display: block; touch-action: none; overflow: visible; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Hướng dẫn tương tác: bong bóng lời thoại, bàn tay chỉ nước đi, lớp tối chừa ô cần chú ý */
  /* Bong bóng nằm ngay dưới bàn chơi (đè lên dòng đếm loài), đuôi chỉ lên bàn */
  .coach { position: absolute; left: 50%; top: calc(100% + 2px); z-index: 3; max-width: 94%; width: max-content; padding: 9px 16px; border-radius: 18px;
    transform: translateX(-50%); background: #fff; color: #1a2a7a; font-size: 15px; font-weight: 800; line-height: 1.3; text-align: center;
    box-shadow: 0 6px 0 #c9d4ff, 0 10px 22px rgba(0,0,0,.35); pointer-events: none; animation: coach-in .35s cubic-bezier(.34, 1.6, .64, 1); }
  .coach::before { content: ''; position: absolute; left: 50%; top: -8px; width: 18px; height: 18px; background: #fff; transform: translateX(-50%) rotate(45deg);
    border-radius: 3px; }
  @keyframes coach-in { from { transform: translate(-50%, -12px) scale(.7); opacity: 0; } }
  #coachLayer { pointer-events: none; }
  .hand { animation: hand-swipe 1.5s ease-in-out infinite; }
  @keyframes hand-swipe { 0%, 15% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 70% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
    90%, 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .trail { stroke-dasharray: 10 10; animation: trail-run .6s linear infinite; }
  @keyframes trail-run { to { stroke-dashoffset: -20; } }

  /* Xu: đồng vàng vẽ bằng CSS, dùng trên HUD, bảng thắng và khi bay */
  .coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; position: relative; flex: none; vertical-align: -3px;
    background: radial-gradient(circle at 35% 30%, #fff7b8, #ffcf3f 45%, #e79a00); box-shadow: inset 0 0 0 2px #b97300, 0 2px 0 rgba(0,0,0,.25); }
  .coin::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; border: 2px solid rgba(185,115,0,.55); }
  .stat.coins { display: inline-flex; align-items: center; gap: 5px; }
  .stat.coins.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.25); background: rgba(255,207,63,.45); } }
  .reward { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 2px auto 0; padding: 3px 14px; border-radius: 99px;
    background: rgba(255,255,255,.55); font-size: 18px; font-weight: 800; }
  .reward .coin { width: 22px; height: 22px; }
  #flyLayer { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  #flyLayer .coin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
  .stage.shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translate(-7px, 2px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  .stage.flash::after { content: ''; position: absolute; inset: -10%; pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,236,150,.75), transparent); animation: fade .7s forwards; }
  @keyframes fade { to { opacity: 0; } }

  /* Tế bào: .cell trượt, .body diễn một lần (mọc, co giãn, vỡ), .jelly thở liên tục */
  .cell { transition: transform .22s cubic-bezier(.3, .7, .4, 1); }
  .body, .jelly, .eyes, .spikes, .flag, .zz text, .bub { transform-box: fill-box; transform-origin: center; }
  .jelly { animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04, .965); } }
  .eyes { animation: blink 5.3s infinite; }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .look { transition: transform .15s; }
  .cell.born .body { animation: born .45s cubic-bezier(.34, 1.7, .64, 1); }
  @keyframes born { from { transform: scale(.25); } }
  .cell.mutated .body { animation: morph .6s cubic-bezier(.34, 1.5, .64, 1); }
  @keyframes morph { from { transform: rotate(-220deg) scale(.3); } }
  .body.sq-x { animation: sqx .3s ease-out; }
  .body.sq-y { animation: sqy .3s ease-out; }
  @keyframes sqx { 35% { transform: scale(1.24, .8); } }
  @keyframes sqy { 35% { transform: scale(.8, 1.24); } }
  /* Đẩy: con đẩy chồm tới, con bị đẩy dồn lại rồi nảy về. --px/--py lệch theo hướng đẩy, --sx/--sy co giãn,
     --d trễ theo vị trí trong dãy (con xa nảy sau) */
  .cell.shove .lean { animation: shove .32s ease-out; }
  @keyframes shove { 40% { transform: translate(var(--px), var(--py)) scale(var(--sx), var(--sy)); } }
  .cell.pushed .body { animation: bumped .42s ease-out var(--d, 0s) both; }
  @keyframes bumped { 40% { transform: translate(var(--px), var(--py)) scale(var(--sx), var(--sy)); }
    75% { transform: translate(calc(var(--px) * -.35), calc(var(--py) * -.35)); } }
  /* Bị đẩy khỏi hộp đúng màu: lắc lư, mắt @@, sao bay vòng trên đầu */
  .cell.dazed .lean { animation: wobble .42s ease-in-out 3; }
  @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .swirl { transform-box: fill-box; transform-origin: center; animation: spin .55s linear infinite; }
  /* Sao chạy trên elip trên đầu: vòng ra trước thì to hơn, ra sau thì nhỏ lại */
  .orbit-star { animation: orbit 1s linear infinite; }
  @keyframes orbit { 0%, 100% { transform: translate(30px, 0); } 12.5% { transform: translate(21px, 6px) scale(1.1); }
    25% { transform: translate(0, 9px) scale(1.2); } 37.5% { transform: translate(-21px, 6px) scale(1.1); } 50% { transform: translate(-30px, 0); }
    62.5% { transform: translate(-21px, -6px) scale(.85); } 75% { transform: translate(0, -9px) scale(.72); } 87.5% { transform: translate(21px, -6px) scale(.85); } }
  .dizzy-fx { animation: fade .35s ease-in 1.3s forwards; }
  /* Virus ăn mèo: virus chồm tới, hai hàm răng tím đớp lại, mèo tím tái rồi bị nuốt mất */
  .cell.lunge .lean { animation: lunge .34s ease-in-out; }
  @keyframes lunge { 45% { transform: translate(var(--px), var(--py)) scale(1.2); } }
  .cell.eaten .body { animation: eaten .44s ease-in forwards; }
  @keyframes eaten { 30% { transform: scale(1.08) rotate(-9deg); filter: sepia(1) hue-rotate(225deg) saturate(2.6); }
    55% { transform: scale(.85) rotate(9deg); filter: sepia(1) hue-rotate(225deg) saturate(2.6); }
    to { transform: scale(.05) rotate(30deg); opacity: 0; filter: sepia(1) hue-rotate(225deg) saturate(2.6); } }
  .jaw { transform-box: fill-box; }
  .jaw.top { animation: jaw-top .46s cubic-bezier(.5, 0, .6, 1) forwards; }
  .jaw.bot { animation: jaw-bot .46s cubic-bezier(.5, 0, .6, 1) forwards; }
  @keyframes jaw-top { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } 55% { transform: translateY(3px); } 70% { transform: none; opacity: 1; } to { opacity: 0; } }
  @keyframes jaw-bot { from { transform: translateY(30px); opacity: 0; } 20% { opacity: 1; } 55% { transform: translateY(-3px); } 70% { transform: none; opacity: 1; } to { opacity: 0; } }
  /* Mèo chết trên ô độc: hồn mèo trắng mờ có vầng hào quang bay lên, lắc nhẹ */
  .soul-fx { transform-box: fill-box; transform-origin: center; animation: ghost-up 1.4s ease-out forwards; }
  .soul-fx .soul { filter: brightness(2.3) saturate(0) drop-shadow(0 0 6px #fff); opacity: .72; }
  @keyframes ghost-up { 0% { transform: translateY(8px) scale(.8); opacity: 0; } 15% { opacity: 1; } 45% { transform: translate(-7px, -38px) scale(.82); }
    75% { transform: translate(6px, -64px) scale(.78); opacity: .8; } 100% { transform: translate(-2px, -88px) scale(.72); opacity: 0; } }
  .cell.pop .body { animation: burst .3s ease-in forwards; }
  @keyframes burst { 35% { transform: scale(1.32); opacity: 1; } to { transform: scale(.1); opacity: 0; } }
  .cell.nope .body { animation: nope .32s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .cell.waking .body { animation: wakeup .6s ease-out; }
  @keyframes wakeup { 35% { transform: translateY(-12px) scale(1.14); } }
  .cell.asleep .body { filter: saturate(.5) brightness(.93); }
  .cell.asleep .cat { filter: grayscale(.45) brightness(.9); }
  .lean { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .15s; }
  .zz { display: none; }
  .cell.asleep .zz { display: inline; }
  .zz text { animation: zfloat 2.4s ease-in-out infinite; }
  .zz text + text { animation-delay: -1.2s; }
  @keyframes zfloat { 0% { transform: translate(0, 6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(9px, -14px); opacity: 0; } }
  .spikes { animation: spin 9s linear infinite; }
  .flag { animation: wiggle .5s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wiggle { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
  #layer.happy .jelly { animation: hop .45s ease-in-out 3; }
  @keyframes hop { 50% { transform: translateY(-14px) scale(1.06, .94); } }
  /* Thua: không bóp dẹt nữa; mặt bất lực (mắt nhắm cong, miệng mếu) và giọt mồ hôi chảy bên trán */
  .cell.sorry .eyes, .cell.sorry .mouth, .cell.faceoff .eyes, .cell.faceoff .mouth { visibility: hidden; }   /* chỉ con đang có mặt vẽ đè */
  .sweat { transform-box: fill-box; transform-origin: 50% 0; animation: sweat 1.7s ease-in infinite; }
  @keyframes sweat { 0% { transform: translateY(-3px) scale(.5); opacity: 0; } 20% { transform: none; opacity: 1; }
    75% { transform: translateY(6px) scale(1, 1.08); opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }
  /* Mèo lúc rảnh (idle): mỗi động tác là một lớp trên ô, chạy trên .lean (gốc ở chân); mặt vẽ đè nằm trong .idlefx */
  .cell.idle-look-l .lean { animation: look-l 1.7s ease-in-out; }
  .cell.idle-look-r .lean { animation: look-r 1.7s ease-in-out; }
  @keyframes look-l { 20%, 55% { transform: rotate(-9deg) translateX(-2px); } 75% { transform: rotate(3deg); } }
  @keyframes look-r { 20%, 55% { transform: rotate(9deg) translateX(2px); } 75% { transform: rotate(-3deg); } }
  .cell.idle-turn .lean { animation: turn 2.2s ease-in-out; }
  @keyframes turn { 15%, 80% { transform: scaleX(-1); } }
  .cell.idle-yawn .lean { animation: yawn 1.5s ease-in-out; }
  @keyframes yawn { 30%, 70% { transform: scale(.95, 1.08) translateY(-2px); } }
  .yawnmouth { transform-box: fill-box; transform-origin: center top; animation: yawnmouth 1.5s ease-in-out both; }
  @keyframes yawnmouth { 0%, 100% { transform: scale(.2); } 30%, 70% { transform: none; } }
  .cell.idle-stretch .lean { animation: stretch 1.1s ease-in-out; }
  @keyframes stretch { 25% { transform: scale(.93, 1.1) translateY(-2px); } 55% { transform: scale(1.08, .92); } 78% { transform: scale(.98, 1.03); } }
  .cell.idle-nuzzle .lean { animation: nuzzle 1.7s ease-in-out; }
  @keyframes nuzzle { 25%, 75% { transform: translate(var(--px), var(--py)) rotate(var(--rot)); } }
  .cell.idle-pet .lean { animation: pet .5s ease-out; }
  @keyframes pet { 40% { transform: translateY(-9px) scale(1.04, .96); } 75% { transform: scale(1.06, .94); } }
  .idlefx.blink { transform-box: fill-box; transform-origin: center; animation: lid .22s ease-in-out both; }
  @keyframes lid { 0%, 100% { opacity: 0; transform: scaleY(.3); } 30%, 70% { opacity: 1; transform: none; } }
  .heart-up { transform-box: fill-box; transform-origin: center; animation: heart-up 1.3s ease-out forwards; }
  @keyframes heart-up { 0% { transform: translateY(4px) scale(.4); opacity: 0; } 25% { opacity: 1; transform: scale(1.1); } 100% { transform: translateY(-34px) scale(.9); opacity: 0; } }

  .bub { animation: rise 2.2s ease-in infinite; }
  @keyframes rise { 0% { transform: translateY(8px) scale(.5); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-24px) scale(1); opacity: 0; } }
  .ring { fill-opacity: .2; stroke-width: 5; stroke-dasharray: 16 10; stroke-linecap: round; animation: spin 14s linear infinite; transition: stroke-width .2s; }
  .ring.ok { stroke-dasharray: none; stroke-width: 7; fill-opacity: .35; animation: none; }
  /* Hộp mục tiêu của Shikacat: hộp màu nào cần mèo màu đó; mèo vào đúng hộp thì hộp sáng lên */
  .ring.box { animation: none; }
  .ring.box image { transition: filter .25s; }
  .ring.box.ok image { filter: drop-shadow(0 0 7px #fff6a0) brightness(1.1); }
  .chev { animation: nudge 1.1s ease-in-out infinite; }
  .portal .swirl { animation: swirlSpin 2.4s linear infinite; }
  @keyframes swirlSpin { to { stroke-dashoffset: -30; } }
  .dualPulse { animation: badgePulse 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes badgePulse { 50% { transform: scale(1.14); } }
  @keyframes nudge { 50% { transform: translateX(5px); opacity: .55; } }
  .mark { fill: none; stroke: #fff; stroke-width: 4; stroke-dasharray: 9 7; animation: pulse .75s ease-in-out infinite alternate; }
  .mark.sel { stroke: var(--gold); stroke-dasharray: none; stroke-width: 6; animation: none; }
  @keyframes pulse { from { opacity: .3; } }
  .pick { cursor: pointer; }

  .species { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .species span { display: flex; align-items: center; gap: 3px; padding: 1px 12px 1px 3px; border-radius: 99px; background: rgba(255,255,255,.1); transition: opacity .2s; }
  .species svg { width: 28px; height: 28px; }
  .species .low { color: #ffe27a; box-shadow: 0 0 0 2px #ffe27a inset; }
  .species .gone { opacity: .35; text-decoration: line-through; }
  .species .enemy { background: rgba(0,0,0,.2); color: var(--muted); }
  .toast { min-height: 21px; text-align: center; font-size: 14px; font-weight: 700; color: #ffd6ea; }

  /* Booster tròn kiểu viên kẹo, số lượng ở góc dưới */
  .boosters { display: flex; justify-content: center; gap: 24px; }
  .bst { position: relative; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .orb { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; font-size: 31px; line-height: 1;
    background: radial-gradient(circle at 35% 28%, #6fa3ff, #2a4fd0 60%, #1a2f8f); border: 4px solid var(--gold);
    box-shadow: 0 4px 0 var(--gold-dark), 0 8px 14px rgba(0,0,0,.35), inset 0 -7px 10px rgba(0,0,0,.28), inset 0 5px 8px rgba(255,255,255,.28);
    transition: transform .12s; }
  .orb span { filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .bst:active .orb { transform: translateY(3px); }
  .badge { position: absolute; top: 44px; left: 47px; min-width: 25px; height: 25px; padding: 0 5px; border-radius: 13px; display: grid; place-items: center;
    background: #10206b; border: 2px solid #fff; color: #fff; font-size: 13px; font-weight: 800; }
  .badge.plus { background: #2fc34e; }
  .bst.on .orb { border-color: #fff; animation: glow .8s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 4px 0 var(--gold-dark), 0 0 24px 9px rgba(255,215,106,.8), inset 0 5px 8px rgba(255,255,255,.28); } }

<script>
'use strict';
// ==LOGIC==
// Ký hiệu ô trong rows:
//   # ngoài cơ thể     . ô trống            ~ ô độc (tế bào vào là chết, không cần lấp)
//   A B C D E mèo đỏ, xanh, vàng, hồng, tím      a b c d e mèo đang ngủ      = băng trơn (ô trống trên băng)
//   ^ v < > virus, mũi tên là hướng nó lan
// Trường thêm: goal = vòng mục tiêu (chữ cái = vòng cần tế bào màu đó, . = không có vòng);
// oneway = [[hàng, cột, hướng]]: màng giữa ô đó và ô kề theo hướng, chỉ cho đi qua theo hướng ấy;
// portal = [[hàng, cột, hướng, hàng kia, cột kia]]: cặp cổng dịch chuyển. Đi ra khỏi ô thứ nhất theo `hướng` thì vào ô kia
// (giữ nguyên hướng đi); đi ra khỏi ô kia theo hướng ngược lại thì vào ô thứ nhất. Cạnh có cổng phải nhìn ra ngoài bàn
// (mép hoặc lỗ). Luật nào cần "ô kề" (bản sao, đẩy dãy, thay thế, trượt băng, virus lan) đều đi qua cổng.
// dual = [[hàng, cột, màu kia, chu kỳ, lượt còn lại]]: mèo hai màu. Chữ cái trong rows là màu hiện tại; mỗi lượt đếm lùi,
// về 0 thì đổi sang màu kia rồi đếm lại từ `chu kỳ`. Hai số cuối tuỳ chọn (mặc định chu kỳ 2, còn lại = chu kỳ).
// Màu kia có thể chưa có con nào trên bàn: bản sao của mèo hai màu lúc nó mang màu đó là mèo thường màu đó, và hộp đòi

const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const VIRUS = { '^': 'up', v: 'down', '<': 'left', '>': 'right' };
const ARROW = { up: '^', down: 'v', left: '<', right: '>' };

function parseLevel(def) {
  const d = Array.isArray(def) ? { rows: def } : def;
  const h = d.rows.length, w = d.rows[0].length;
  const level = { h, w, slot: [], toxic: [], ice: [], init: [], target: [], oneway: [], blocked: new Set(), kill: d.kill || null,
    portal: {}, portals: [] };
  let id = 0;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = d.rows[r][c], t = d.goal ? d.goal[r][c] : '.';
    level.slot.push(ch !== '#');
    level.toxic.push(ch === '~');
    level.ice.push(ch === '=');
    let cell = null;
    if (VIRUS[ch]) cell = { color: 'V', dir: VIRUS[ch], id: id++ };
    else if (/[A-Z]/.test(ch)) cell = { color: ch, id: id++ };
    else if (/[a-z]/.test(ch)) cell = { color: ch.toUpperCase(), sleep: true, id: id++ };
    level.init.push(cell);
    level.target.push(/[A-Z]/.test(t) ? t : null);
  }
  // Màng cho đi i -> j theo `dir`, chặn chiều ngược lại
  for (const [r, c, dir] of d.oneway || []) {
    const i = r * w + c, j = (r + DIRS[dir][0]) * w + c + DIRS[dir][1];
    level.oneway.push([i, j, dir]);
    level.blocked.add(j + OPPOSITE[dir]);
  }
  // Cổng dịch chuyển: nối hai ô qua cạnh nhìn ra ngoài bàn
  const outside = (i, dir) => {
    const r = Math.floor(i / w) + DIRS[dir][0], c = i % w + DIRS[dir][1];
    return r < 0 || c < 0 || r >= h || c >= w || !level.slot[r * w + c];
  };
  for (const [r, c, dir, r2, c2] of d.portal || []) {
    const i = r * w + c, j = r2 * w + c2, back = OPPOSITE[dir];
    if (!level.slot[i] || !level.slot[j] || i === j) throw new Error('Cổng phải nằm trên hai ô khác nhau của thân');
    if (!outside(i, dir) || !outside(j, back)) throw new Error('Cạnh có cổng phải nhìn ra ngoài bàn');
    if (level.portal[i + dir] !== undefined || level.portal[j + back] !== undefined) throw new Error('Mỗi cạnh chỉ một cổng');
    level.portal[i + dir] = j;
    level.portal[j + back] = i;
    level.portals.push([i, j, dir]);
  }
  level.nextId = id;
  level.hasTarget = level.target.some(Boolean);
  level.colors = [...new Set(level.init.filter(c => c && c.color !== 'V' && c.color !== level.kill).map(c => c.color))];
  // Mèo hai màu: màu hiện tại lấy từ rows; màu kia là màu bất kỳ khác (có thể chưa có con nào trên bàn: mèo hai màu là nguồn duy nhất của màu đó)
  for (const [r, c, alt, period = 2, left = period] of d.dual || []) {
    const i = r * w + c, cell = level.init[i];
    if (!cell || cell.sleep || cell.color === 'V' || alt === cell.color || !/[A-E]/.test(alt) || period < 1 || left < 1 || left > period)
      throw new Error('Mèo hai màu không hợp lệ ở ô ' + r + ',' + c);
    level.init[i] = { ...cell, alt, period, left };
  }
  level.init = wake(level, level.init);
  return level;
}

// Ô kế tiếp theo hướng; -1 nếu ra ngoài bàn, ngoài cơ thể, hoặc bị màng chặn. Cạnh có cổng thì tới ô bên kia cổng.
function step(level, i, dir) {
  const through = level.portal[i + dir];
  if (through !== undefined) return through;          // cổng dịch chuyển: nối thẳng tới ô kia
  const r = Math.floor(i / level.w) + DIRS[dir][0], c = i % level.w + DIRS[dir][1];
  if (r < 0 || c < 0 || r >= level.h || c >= level.w) return -1;
  const j = r * level.w + c;
  return level.slot[j] && !level.blocked.has(i + dir) ? j : -1;
}

// Các ô kề (bỏ qua màng), dùng để đánh thức tế bào ngủ.
function near(level, i) {
  const out = [];
  for (const dir in DIRS) {
    const r = Math.floor(i / level.w) + DIRS[dir][0], c = i % level.w + DIRS[dir][1];
    if (r >= 0 && c >= 0 && r < level.h && c < level.w && level.slot[r * level.w + c]) out.push(r * level.w + c);
  }
  return out;
}

// Mọi dãy ngang/dọc từ 3 tế bào cùng màu trở lên. Virus không tạo dãy.
function findRuns(level, cells) {
  const out = new Set();
  const colorAt = i => cells[i] && cells[i].color !== 'V' ? cells[i].color : null;
  const scan = (start, stride, count) => {
    let runStart = 0;
    for (let k = 1; k <= count; k++) {
      const prev = colorAt(start + (k - 1) * stride);
      const cur = k < count ? colorAt(start + k * stride) : null;
      if (cur && cur === prev) continue;
      if (prev && k - runStart >= 3) for (let j = runStart; j < k; j++) out.add(start + j * stride);
      runStart = k;
    }
  };
  for (let r = 0; r < level.h; r++) scan(r * level.w, 1, level.w);
  for (let c = 0; c < level.w; c++) scan(c, level.w, level.h);
  return [...out];
}

// Giết mọi tế bào đang đứng trên ô độc, ghi chúng vào `dead`.
function poison(level, cells, dead) {
  let out = cells;
  level.toxic.forEach((t, i) => {
    if (!t || !out[i]) return;
    if (out === cells) out = cells.slice();
    dead.push(out[i]);
    out[i] = null;
  });
  return out;
}

// Tế bào ngủ thức dậy khi đứng cạnh một tế bào cùng màu đang thức (lan dây chuyền).
function wake(level, cells) {
  let out = cells;
  for (let changed = true; changed;) {
    changed = false;
    for (let i = 0; i < out.length; i++) {
      const c = out[i];
      if (!c || !c.sleep || !near(level, i).some(j => out[j] && !out[j].sleep && out[j].color === c.color)) continue;
      if (out === cells) out = cells.slice();
      out[i] = { ...c, sleep: false };
      changed = true;
    }
  }
  return out;
}

// Mèo hai màu (đang thức) đếm lùi một lượt; về 0 thì đổi sang màu kia rồi đếm lại từ chu kỳ. Ghi các con vừa đổi vào `flipped`.
function tick(level, cells, flipped) {
  let out = cells;
  cells.forEach((c, i) => {
    if (!c || !c.alt || c.sleep) return;
    if (out === cells) out = cells.slice();
    if (c.left > 1) { out[i] = { ...c, left: c.left - 1 }; return; }
    out[i] = { ...c, color: c.alt, alt: c.color, left: c.period };
    flipped.push([c.id, c.color, c.alt]);
  });
  return out;
}

// Kết thúc một lượt sau khi bản sao đã vào chỗ: ô độc giết, mèo hai màu đổi màu, khử 3, virus lan (vào ô trống hoặc ăn tế bào),
// ô độc giết tiếp, rồi tế bào ngủ thức dậy. Trả từng chặng để giao diện diễn hoạt.
function resolve(level, placed, born, nextId) {
  const removed = [];
  const flipped = [];
  let cells = tick(level, poison(level, placed, removed), flipped);
  const runs = findRuns(level, cells);
  if (runs.length) {
    cells = cells.slice();
    for (const i of runs) { removed.push(cells[i]); cells[i] = null; }
  }
  const cleared = cells;
  const viruses = [], spread = [], eaten = [];
  cells.forEach((c, i) => { if (c && c.color === 'V') viruses.push(i); });
  if (viruses.length) cells = cells.slice();
  for (const i of viruses) {
    const j = step(level, i, cells[i].dir);
    if (j < 0 || (cells[j] && cells[j].color === 'V')) continue;
    if (cells[j]) eaten.push(cells[j]);
    cells[j] = { color: 'V', dir: cells[i].dir, id: nextId++ };
    spread.push([cells[j].id, i]);
  }
  const infected = cells;
  const poisoned = [];
  cells = wake(level, poison(level, cells, poisoned));
  return { moved: placed, removed, cleared, spread, eaten, infected, poisoned, cells, born, nextId, flipped };
}

// Vuốt tế bào `from` theo `dir`. Bản sao vào ô kề; nếu ô kề có tế bào thì đẩy cả dãy tới ô trống gần nhất
// theo hướng đó, không còn ô trống (gặp mép, lỗ, màng chặn hoặc mèo ngủ) thì bản sao thay thế tế bào kề.
// Mèo ngủ say như hòn đá: không bị đẩy, không bị đè lên. Sau đó kết thúc lượt (resolve).
// Trả null nếu không vuốt được (tế bào ngủ, virus, ra ngoài, thay thế một tế bào cùng màu hoặc một mèo ngủ).
function swipe(level, cells, from, dir, newId = -1) {
  const parent = cells[from];
  const to = step(level, from, dir);
  if (!parent || parent.sleep || parent.color === 'V' || to < 0) return null;
  const chain = [];
  let k = to;
  while (k >= 0 && cells[k] && !cells[k].sleep && chain.length < cells.length) { chain.push(k); k = step(level, k, dir); }
  if (k >= 0 && cells[k]) k = -1;                    // dãy chạm mèo ngủ (hoặc chạy trọn một vòng qua cổng): như chạm tường, không còn chỗ đẩy
  const next = cells.slice();
  let pushed = false, replaced = null;
  if (k >= 0) {
    for (let i = chain.length - 1; i >= 0; i--) next[step(level, chain[i], dir)] = cells[chain[i]];
    pushed = chain.length > 0;
  } else {
    if (cells[to].color === parent.color || cells[to].sleep) return null;
    replaced = cells[to];
  }
  // Băng trơn: bản sao vào ô băng đang trống thì trượt tiếp theo hướng vuốt, qua các ô băng trống, tới khi gặp vật cản
  // (mép, lỗ, màng chặn, quân khác) hoặc ra khỏi băng (dừng ở ô thường đầu tiên). Dãy bị đẩy và virus không trượt.
  let at = to;
  if (!pushed && !replaced) {
    for (let guard = 0; level.ice[at] && guard < cells.length; guard++) {
      const n = step(level, at, dir);
      if (n < 0 || next[n]) break;
      at = n;
    }
  }
  next[at] = { color: parent.color, id: newId };
  return { ...resolve(level, next, [newId, from], newId + 1), pushed, replaced, slid: at !== to };
}

// Booster Đột biến: đổi một tế bào sang màu loài khác. Không cho đổi tế bào cuối cùng của một loài.
function mutate(level, cells, i, color, newId = -1) {
  const c = cells[i];
  if (!c || c.color === 'V' || c.alt || c.color === color || !level.colors.includes(color)) return null;
  if (level.colors.includes(c.color) && !cells.some((o, j) => j !== i && o && o.color === c.color)) return null;
  const next = cells.slice();
  next[i] = { color, id: newId };
  return resolve(level, next, [newId, i], newId + 1);
}

// Booster Cấy ghép: bản sao của tế bào `from` mọc ở một ô trống bất kỳ (trừ ô độc), không đẩy gì.
function transplant(level, cells, from, to, newId = -1) {
  const c = cells[from];
  if (!c || c.color === 'V' || !level.slot[to] || level.toxic[to] || cells[to]) return null;
  const next = cells.slice();
  next[to] = { color: c.color, id: newId };
  return resolve(level, next, [newId, from], newId + 1);
}

// Lấp kín: mọi ô (trừ ô độc) có tế bào không phải virus.
const isFull = (level, cells) => level.slot.every((s, i) => !s || level.toxic[i] || (cells[i] && cells[i].color !== 'V'));
// Khoá một ô cho bộ giải và test: mèo hai màu thêm màu kia và lượt còn lại, ví dụ [AB2].
const cellKey = c => !c ? '.' : c.color === 'V' ? ARROW[c.dir] : c.alt ? '[' + c.color + c.alt + c.left + ']' : c.sleep ? c.color.toLowerCase() : c.color;
const keyOf = cells => cells.map(cellKey).join('');

// Các loài có mặt lúc đầu nhưng nay không còn tế bào nào (kể cả đang ngủ). Có loài tuyệt chủng là thua.
const extinct = (level, cells) => level.colors.filter(col => !cells.some(c => c && c.color === col));
const isLost = (level, cells) => extinct(level, cells).length > 0;
// Mọi level cùng một mục tiêu: lấp kín cơ thể. Cơ chế chỉ thêm điều kiện: mọi hộp có mèo đúng màu,
// không còn vi khuẩn (virus thì đã không được tính là ô đã lấp).
const targetsDone = (level, cells) => level.target.every((t, i) => !t || (cells[i] && cells[i].color === t));
const isComplete = (level, cells) => isFull(level, cells) && targetsDone(level, cells)
  && !(level.kill && cells.some(c => c && c.color === level.kill));
const isWon = (level, cells) => isComplete(level, cells) && !isLost(level, cells);

function allMoves(level, cells) {
  const moves = [];
  cells.forEach((c, i) => { if (c && !c.sleep && c.color !== 'V') for (const dir in DIRS) moves.push([i, dir]); });
  return moves;
}

// BFS (bỏ qua id): chuỗi vuốt ngắn nhất để thắng mà không loài nào tuyệt chủng;
// null nếu đã thua hoặc không tìm thấy trong giới hạn.
// Tìm theo A*: mỗi lượt chỉ sinh đúng một con mèo, nên số mèo còn thiếu để kín ổ (virus và vi khuẩn không tính)
// không bao giờ lớn hơn số nước còn lại. Ước lượng này không đánh giá quá, nên lời giải vẫn ngắn nhất như BFS
// nhưng duyệt ít trạng thái hơn nhiều trên bàn lớn. Dừng khi quá maxNodes trạng thái hoặc maxMs mili giây;
// khi đó solve.cut = true (chưa tìm ra, chứ chưa chắc là hết đường thắng).
function solve(level, start, maxNodes = 80000, maxMs = Infinity) {
  solve.cut = false;
  if (isLost(level, start)) return null;
  if (isComplete(level, start)) return [];
  const t0 = Date.now();
  let expanded = 0;
  const need = level.slot.filter((s, i) => s && !level.toxic[i]).length;
  const h = cells => need - cells.filter(c => c && c.color !== 'V' && c.color !== level.kill).length;
  const startKey = keyOf(start);
  const best = new Map([[startKey, { g: 0, cells: start, parent: null }]]);
  const buckets = [];             // buckets[f]: các trạng thái có g + h = f, lấy cái vào sau trước
  buckets[h(start)] = [startKey];
  for (let f = h(start); f < buckets.length; f++) {
    const bucket = buckets[f] || [];
    while (bucket.length) {
      const key = bucket.pop(), node = best.get(key);
      if (node.done || node.g + h(node.cells) !== f) continue;   // đã xét, hoặc đã có đường ngắn hơn
      node.done = true;
      if ((++expanded & 127) === 0 && Date.now() - t0 > maxMs) { solve.cut = true; return null; }
      if (isComplete(level, node.cells)) {
        const path = [];
        for (let k = key; best.get(k).parent; k = best.get(k).parent[0]) path.unshift(best.get(k).parent.slice(1));
        return path;
      }
      for (const [from, dir] of allMoves(level, node.cells)) {
        const res = swipe(level, node.cells, from, dir);
        if (!res || isLost(level, res.cells)) continue;
        const k2 = keyOf(res.cells), g2 = node.g + 1, old = best.get(k2);
        if (!old && best.size >= maxNodes) { solve.cut = true; continue; }
        if (old && old.g <= g2) continue;
        best.set(k2, { g: g2, cells: res.cells, parent: [key, from, dir] });
        (buckets[g2 + h(res.cells)] ||= []).push(k2);
      }
    }
  }
  return null;
}

// Tiến độ lưu trên máy: level đang chơi, số tim, mốc bắt đầu hồi tim, số booster, cơ chế đã xem hướng dẫn, tắt tiếng,

const save = { level: 0, hearts: MAX_HEARTS, heartAt: null, seen: [], muted: false, prog: {}, coins: 0, unlockAll: false, ...store.get() };
save.boosters = { ...START_BOOSTERS, ...save.boosters };
const persist = () => store.set(save);

// Các khối level theo cơ chế, theo chỉ số level (từ 0); khối cuối kéo tới level cuối cùng. Bản đồ không hiện khối
// (một đường liền); khối dùng để sắp level từ dễ đến khó trong từng khối (tools/order.js) và xuất dữ liệu cho Unity.
const CHAPTERS = [
  { name: 'Phòng nuôi cấy', icon: '🧪', note: 'Chia, khử 3, đẩy, thay thế', from: 0, to: 15 },
  { name: 'Vào vị trí', icon: '🎯', note: 'Hộp mục tiêu', from: 16, to: 27 },
  { name: 'Màng và độc', icon: '🚪', note: 'Màng một chiều, ô độc', from: 28, to: 36 },
  { name: 'Ngủ và virus', icon: '🦠', note: 'Mèo ngủ, virus', from: 37, to: 47 },
  { name: 'Băng trơn', icon: '🧊', note: 'Băng trơn, ôn các cơ chế đã học', from: 48, to: 60 },
  { name: 'Cổng dịch chuyển', icon: '🌀', note: 'Cổng là đường duy nhất sang vùng trống', from: 61, to: 66 },
  { name: 'Mèo hai màu', icon: '🎭', note: 'Màu hiếm chỉ mèo hai màu mới có', from: 67, to: 72 },
  { name: 'Đại gia đình', icon: '🏠', note: 'Bàn lớn, đông mèo, mọi cơ chế', from: 73, to: 79 },
  { name: 'Đủ sắc màu', icon: '🌈', note: '4 rồi 5 màu cùng lúc', from: 80, to: LEVELS.length - 1 },
];

// Kết quả lưu theo nội dung level (khung, mèo, hộp, màng), không theo số thứ tự, để chèn thêm level không làm lệch sao.
const levelKey = i => { const d = LEVELS[i]; return Array.isArray(d) ? d.join('/') : JSON.stringify([d.rows, d.goal, d.oneway, d.kill, d.portal, d.dual]); };
const record = i => save.prog[levelKey(i)];

// Khoá theo thứ tự (qua level trước mới chơi được level sau; level đã qua thì luôn chơi lại được).
// Đang tắt để chơi thử mọi level; đổi thành true để bật lại.
const LOCK_IN_ORDER = false;
const isDone = i => !!record(i);
const unlocked = i => !LOCK_IN_ORDER || save.unlockAll || i === 0 || isDone(i) || isDone(i - 1);
const starsOf = i => record(i) ? record(i).stars : 0;
const nextLevel = () => { for (let i = 0; i < LEVELS.length; i++) if (!isDone(i) && unlocked(i)) return i; return -1; };

// Số lần vuốt tối ưu của mỗi level (bộ giải tính lần đầu cần tới, rồi nhớ lại). Sao: bằng tối ưu 3 sao,
// dư tối đa 2 nước 2 sao, còn lại 1 sao. Dùng booster cũng tính là một nước.
// Nhớ cả lời giải và khoá các trạng thái dọc theo nó: Gợi ý khi người chơi còn đi đúng lời giải thì không cần giải lại.
const parCache = new Map();
function solutionOf(i) {
  if (!parCache.has(i)) {
    const lv = parseLevel(LEVELS[i]), path = solve(lv, lv.init);
    const keys = [keyOf(lv.init)];
    let c = lv.init;
    for (const [f, d] of path || []) { c = swipe(lv, c, f, d).cells; keys.push(keyOf(c)); }
    parCache.set(i, { par: path ? path.length : null, path, keys });
  }
  return parCache.get(i);
}
const parOf = i => solutionOf(i).par;
const starsFor = (moves, par) => !par || moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
const starRow = n => [1, 2, 3].map(k => `<span class="${k <= n ? 'on' : ''}">★</span>`).join('');

// Huy hiệu góc phải dưới nút level trên bản đồ, để biết yếu tố mới nằm ở đâu: level đầu tiên của mỗi cơ chế,
// lần đầu gặp mèo hồng / mèo tím, level có hướng dẫn tương tác (👆) hoặc mẹo đầu màn (💡).
const FIRST = new Map();
LEVELS.forEach((def, i) => {
  const lv = parseLevel(def);
  for (const m of MECHANICS) if ((m.fresh || m.key === 'target') && !FIRST.has(m.key) && m.has(lv, i)) FIRST.set(m.key, i);
  for (const [col, icon, text] of [['D', '🩷', 'Mèo hồng'], ['E', '💜', 'Mèo tím']])
    if (!FIRST.has(col) && lv.colors.includes(col)) FIRST.set(col, { i, icon, text });
});
function newLabels(i) {
  const def = LEVELS[i], out = MECHANICS.filter(m => FIRST.get(m.key) === i).map(m => ({ icon: m.icon, text: m.title }));
  for (const col of ['D', 'E']) { const f = FIRST.get(col); if (f && f.i === i) out.push(f); }
  if (!Array.isArray(def) && def.tut) out.push({ icon: '👆', text: 'Có hướng dẫn' });
  if (!Array.isArray(def) && def.tip) out.push({ icon: '💡', text: 'Có mẹo' });
  return out;
}
const newIcons = i => newLabels(i).slice(0, 2).map(l => l.icon).join('');

// history: mỗi mục { cells, spent, reset } với spent là booster đã dùng ở nước đó (hoàn tác thì trả lại),
// reset đánh dấu lần bấm "Chơi lại" (số lần vuốt tính từ đó).
// mode: booster đang chọn, { kind: 'mutate', cell } hoặc { kind: 'clone', from }.
let index = 0, level, cells, history, nextId, busy = false, solved = false, lost = false, gesture = null, mode = null;
let layer, overlay, nodes = new Map(), shown = [], ringsOk = new Set(), screen = 'home', freshWin = -1;
let coinShown = save.coins, coached = false;   // số xu đang hiện (đếm dần khi xu bay về); đang có bước hướng dẫn
const movesNow = () => { let n = 0; for (let k = history.length - 1; k >= 0 && !history[k].reset; k--) n++; return n; };

// ---------------------------------------------------------------------------
// Âm thanh: tiếng mèo thật (Mixkit) ngẫu nhiên mỗi lần chia; tiếng giao diện, thắng, thua và nhạc nền lấy từ Shikacat;
// thiếu file nào thì dùng tiếng tổng hợp bằng Web Audio thay cho file đó. Âm thanh mở ở lần chạm đầu tiên.
// ---------------------------------------------------------------------------
const ART = 'shikacat/';                    // asset lấy tạm từ Shikacat, không nằm trong git
const sfx = (() => {
  let ac = null;
  const audio = () => {
    if (save.muted) return null;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  };
  // Một nốt: tần số trượt từ f tới f2, tắt dần trong t giây
  function tone(f, f2, t, { type = 'sine', vol = .16, at = 0 } = {}) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + t);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + t);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + t + .03);
  }
  // Tiếng ồn qua bộ lọc dải: xèo, phụt
  function hiss(t, { freq = 1500, q = .8, vol = .12, at = 0 } = {}) {
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * t), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination);
    s.start(a.currentTime + at);
  }
  const notes = (list, gap, opts) => list.forEach((f, k) => tone(f, f * 1.01, .2, { ...opts, at: k * gap }));
  const rnd = (x, y) => x + Math.random() * (y - x);

  // Tiếng mèo: sóng răng cưa có rung nhẹ, cao độ trượt lên rồi xuống ("mi-ao"), qua hai bộ lọc dải mô phỏng
  // khẩu hình m → e → a → o. Mỗi màu một giọng (đỏ vừa, xanh trầm, vàng cao), mỗi lần một biến thể ngẫu nhiên.
  const VOICE = { A: 560, B: 430, C: 720, G: 620 };
  function meow(color, short = false) {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime, base = (VOICE[color] || 560) * rnd(.88, 1.14), dur = short ? rnd(.16, .24) : rnd(.3, .58);
    const peak = rnd(.25, .4);
    const o = a.createOscillator(), vib = a.createOscillator(), depth = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(base * .78, t0);
    o.frequency.linearRampToValueAtTime(base * rnd(1.15, 1.35), t0 + dur * peak);
    o.frequency.linearRampToValueAtTime(base * rnd(.62, .8), t0 + dur);
    vib.frequency.value = rnd(5, 8);
    depth.gain.value = base * .025;
    vib.connect(depth).connect(o.frequency);
    const f1 = a.createBiquadFilter(), f2 = a.createBiquadFilter(), g = a.createGain();
    f1.type = f2.type = 'bandpass';
    f1.Q.value = 5; f2.Q.value = 7;
    f1.frequency.setValueAtTime(350, t0); f1.frequency.linearRampToValueAtTime(1000, t0 + dur * peak); f1.frequency.linearRampToValueAtTime(600, t0 + dur);
    f2.frequency.setValueAtTime(1300, t0); f2.frequency.linearRampToValueAtTime(2100, t0 + dur * peak); f2.frequency.linearRampToValueAtTime(1000, t0 + dur);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(.45, t0 + .05);     // ngang tiếng Shikacat
    g.gain.setValueAtTime(.45, t0 + dur * .6);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(f1).connect(g);
    o.connect(f2).connect(g);
    g.connect(a.destination);
    o.start(t0); vib.start(t0);
    o.stop(t0 + dur + .05); vib.stop(t0 + dur + .05);
  }

  // Tiếng lấy từ Shikacat: phát bản sao của thẻ <audio> để chồng tiếng được; trả false nếu thiếu file.
  const FILES = { button: 'SC_SFX_UI_Button_01', open: 'SC_SFX_UI_Popup_Open_01', close: 'SC_SFX_UI_Popup_Close_01',
    mistake: 'SC_Gameplay_Mistake_01', box: 'SC_SFX_Gameplay_Box_Created_01', chord: 'SC_SFX_Gameplay_AllBoxesCreated_01',
    win: 'SC_SFX_UI_Win_01', lose: 'SC_SFX_UI_Lose_01' };
  const clips = {};
  for (const k in FILES) {
    const el = new Audio(`${ART}audio/${FILES[k]}.ogg`);
    el.preload = 'auto';
    el.addEventListener('error', () => { clips[k] = null; });
    clips[k] = el;
  }
  function clip(k, { vol = .7, rate = 1 } = {}) {
    if (save.muted) return true;
    if (!clips[k]) return false;
    const c = clips[k].cloneNode();
    c.volume = vol;
    c.preservesPitch = false;
    c.playbackRate = rate;
    c.play().catch(() => { /* trình duyệt chưa cho phát */ });
    return true;
  }
  // Tiếng mèo thật từ Mixkit (sfx/, giấy phép miễn phí, xem sfx/NGUON.txt): mỗi lần chia chọn ngẫu nhiên một tiếng,
  // không lặp tiếng vừa phát; mỗi màu một giọng nhờ đổi cao độ. Thiếu file thì dùng tiếng mèo tổng hợp ở trên.
  const PITCH = { A: 1, B: .86, C: 1.16, D: 1.26, E: .78, G: 1.08 };
  const meows = ['meow-sweet', 'meow-attention', 'meow-hungry', 'meow-cartoon'].map(n => {
    const el = new Audio(`sfx/${n}.mp3`);
    el.preload = 'auto';
    el.addEventListener('error', () => { const k = meows.indexOf(el); if (k >= 0) meows.splice(k, 1); });
    return el;
  });
  const angry = new Audio('sfx/meow-angry.mp3');
  angry.preload = 'auto';
  let angryOk = true;
  angry.addEventListener('error', () => { angryOk = false; });
  let lastMeow = -1;
  function realMeow(color, { vol = .75, up = 1 } = {}) {
    if (save.muted) return true;
    if (!meows.length) return false;
    let k = Math.floor(Math.random() * meows.length);
    if (meows.length > 1 && k === lastMeow) k = (k + 1) % meows.length;
    lastMeow = k;
    const c = meows[k].cloneNode();
    c.volume = vol;
    c.preservesPitch = false;
    c.playbackRate = (PITCH[color] || 1) * up * rnd(.95, 1.06);
    c.play().catch(() => { /* trình duyệt chưa cho phát */ });
    return true;
  }
  function angryMeow() {
    if (save.muted) return true;
    if (!angryOk) return false;
    const c = angry.cloneNode();
    c.volume = .6;
    c.play().catch(() => { /* trình duyệt chưa cho phát */ });
    return true;
  }

  const bgm = new Audio(`${ART}audio/SC_BGM_01.ogg`);
  bgm.loop = true;
  bgm.volume = .3;

  return {
    tap() { clip('button', { vol: .5 }) || tone(620, 520, .05, { vol: .05 }); },
    open() { clip('open', { vol: .6 }) || tone(500, 760, .1, { vol: .06 }); },
    close() { clip('close', { vol: .6 }) || tone(700, 480, .1, { vol: .06 }); },
    divide(color) { realMeow(color) || meow(color); },
    push() { tone(260, 190, .1, { type: 'triangle', vol: .1, at: .03 }); },
    replace() { tone(340, 170, .14, { type: 'triangle', vol: .12 }); },
    clear(n) { clip('chord', { vol: .7 }) || notes([523, 659, 784, 1047, 1319].slice(0, Math.max(3, Math.min(5, n))), .05, { type: 'triangle', vol: .11 }); hiss(.12, { freq: 3200, vol: .06 }); },
    toxic() { hiss(.4, { freq: 5200, q: .6, vol: .1 }); tone(230, 80, .32, { type: 'sawtooth', vol: .035 }); },
    eat() { tone(190, 70, .15, { type: 'square', vol: .07 }); hiss(.1, { freq: 700, vol: .1 }); },
    wake(color) { realMeow(color, { vol: .55, up: 1.15 }) || meow(color, true); },
    ding() { clip('box', { vol: .8, rate: rnd(1, 1.2) }) || notes([988, 1480], .07, { vol: .09 }); },
    nope() { angryMeow() || clip('mistake', { vol: .6 }) || tone(160, 110, .13, { type: 'square', vol: .05 }); },
    // Chạm (không vuốt) vào mèo: meo khẽ, cao hơn một chút
    pet(color) { realMeow(color, { vol: .35, up: 1.12 }) || meow(color, true); },
    // Chạm vào virus: tiếng ọ ọ khàn; vi khuẩn: tiếng bóp nhũn (không phải mèo nên không kêu meo)
    grumble() { tone(170, 80, .2, { type: 'sawtooth', vol: .05 }); tone(230, 120, .14, { type: 'square', vol: .03, at: .07 }); hiss(.09, { freq: 900, vol: .05 }); },
    squish() { tone(430, 250, .09, { vol: .09 }); tone(260, 520, .08, { type: 'triangle', vol: .05, at: .06 }); },
    booster() { notes([784, 988, 1175, 1568], .05, { vol: .1 }); hiss(.45, { freq: 6500, vol: .03 }); },
    revive() { notes([523, 659, 784, 1047, 1319], .07, { type: 'triangle', vol: .12 }); },
    // Xu chạm ô đếm: "ting" hai nốt, cao dần theo số xu đã về; đủ xu thì "ka-ching"
    coin(k = 0) { const f = 1568 * Math.pow(1.035, Math.min(k, 14)); tone(f, f * 1.01, .07, { vol: .07 }); tone(f * 1.5, f * 1.51, .1, { vol: .045, at: .035 }); },
    cashout() { notes([1047, 1319, 1568, 2093], .055, { type: 'triangle', vol: .1 }); hiss(.3, { freq: 7500, vol: .045, at: .1 }); },
    win() { clip('win', { vol: .8 }) || notes([523, 659, 784, 1047, 784, 1047, 1319], .09, { type: 'triangle', vol: .12 }); },
    lose() { clip('lose', { vol: .8 }) || notes([392, 349, 311, 247], .15, { type: 'sawtooth', vol: .07 }); },
    music(on) { if (on && !save.muted) bgm.play().catch(() => { /* chưa có thao tác của người chơi */ }); else bgm.pause(); },
    meow,
  };
})();
// Rung nhẹ trên điện thoại; trình duyệt chỉ cho rung sau khi người dùng đã chạm thật vào trang.
const buzz = ms => {
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch (e) { /* không hỗ trợ rung */ }
};

// ---------------------------------------------------------------------------
// Hạt hiệu ứng vẽ trên canvas phủ lên bàn chơi
// ---------------------------------------------------------------------------
const fx = (() => {
  const cv = $('fx'), g = cv.getContext('2d');
  let parts = [], last = 0, running = false;
  const rand = (a, b) => a + Math.random() * (b - a);
  function fit() {
    const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    const w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    g.setTransform(d, 0, 0, d, 0, 0);
  }
  // Tâm ô i (đơn vị SVG) -> px trên canvas, kèm tỉ lệ px trên một đơn vị SVG
  function center(i) {
    const [x, y] = pos(i), m = board.getScreenCTM(), r = cv.getBoundingClientRect();
    return [m.a * (x + SZ / 2) + m.e - r.left, m.d * (y + SZ / 2) + m.f - r.top, m.a];
  }
  function add(p) {
    parts.push({ age: 0, vx: 0, vy: 0, ...p });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }
  function star(x, y, r) {
    g.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .35 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  }
  function draw(p, k) {
    g.fillStyle = g.strokeStyle = p.color;
    if (p.kind === 'dot') { g.beginPath(); g.arc(p.x, p.y, Math.max(.1, p.r * (1 - k * .5)), 0, 7); g.fill(); }
    else if (p.kind === 'ring') { g.lineWidth = Math.max(.1, p.w * (1 - k)); g.beginPath(); g.arc(p.x, p.y, p.r + p.grow * k, 0, 7); g.stroke(); }
    else if (p.kind === 'puff') { g.beginPath(); g.arc(p.x, p.y, p.r * (.6 + k), 0, 7); g.fill(); }
    else if (p.kind === 'star') star(p.x, p.y, Math.max(.1, p.r * (1 - Math.abs(k - .35))));
    else if (p.kind === 'conf') { g.save(); g.translate(p.x, p.y); g.rotate(p.spin * p.age); g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }
    else if (p.kind === 'text') {
      g.font = `800 ${p.r}px 'Baloo 2', system-ui, sans-serif`; g.textAlign = 'center';
      g.lineWidth = 5; g.strokeStyle = '#10206b'; g.strokeText(p.text, p.x, p.y); g.fillText(p.text, p.x, p.y);
    }
  }
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    fit();
    g.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => (p.age += dt) < p.life);
    for (const p of parts) {
      p.vy += (p.grav || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      g.globalAlpha = Math.max(0, 1 - p.age / p.life) * (p.alpha ?? 1);
      draw(p, p.age / p.life);
    }
    g.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; g.clearRect(0, 0, cv.width, cv.height); }
  }
  return {
    clear() { parts = []; },
    // giọt kẹo bắn tung khi tế bào vỡ
    burst(i, color, n = 12) {
      const [x, y, s] = center(i);
      for (let k = 0; k < n; k++) {
        const a = rand(0, 6.28), v = rand(80, 230) * s;
        add({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 70 * s, grav: 650 * s, r: rand(3, 7.5) * s, life: rand(.45, .8), color });
      }
    },
    ring(i, color, size = 1) { const [x, y, s] = center(i); add({ kind: 'ring', x, y, r: 22 * s, grow: 64 * s * size, w: 9 * s, life: .45, color }); },
    sparkle(i, color = '#fff6b0', n = 8) {
      const [x, y, s] = center(i);
      for (let k = 0; k < n; k++) {
        const a = rand(0, 6.28), v = rand(30, 120) * s;
        add({ kind: 'star', x: x + Math.cos(a) * 22 * s, y: y + Math.sin(a) * 22 * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(5, 10) * s, life: rand(.5, .85), color });
      }
    },
    smoke(i) {
      const [x, y, s] = center(i);
      for (let k = 0; k < 10; k++) add({ kind: 'puff', x: x + rand(-18, 18) * s, y: y + rand(-10, 10) * s, vx: rand(-25, 25) * s, vy: rand(-95, -40) * s,
        r: rand(10, 18) * s, life: rand(.6, 1), alpha: .55, color: k % 3 ? '#a6dc3f' : '#56751c' });
    },
    splat(i) {
      const [x, y, s] = center(i);
      for (let k = 0; k < 12; k++) {
        const a = rand(0, 6.28), v = rand(60, 170) * s;
        add({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, grav: 220 * s, r: rand(3, 6.5) * s, life: .55, color: k % 2 ? '#b56cff' : '#6b2fb5' });
      }
    },
    rainbow(i) {
      const [x, y, s] = center(i);
      ['#ff5d73', '#ffd23f', '#84db4c', '#4f8dff', '#b56cff'].forEach((color, k) =>
        add({ kind: 'ring', x, y, r: (8 + k * 7) * s, grow: 54 * s, w: 7 * s, life: .5 + k * .06, color }));
      this.sparkle(i, '#ffffff', 12);
    },
    trail(from, to, color) {
      const [x1, y1, s] = center(from), [x2, y2] = center(to);
      for (let k = 0; k <= 16; k++) {
        const t = k / 16;
        add({ kind: 'star', x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t - Math.sin(t * Math.PI) * 46 * s, vy: -18 * s,
          r: 8 * s, life: .3 + t * .4, color: k % 2 ? '#ffffff' : color });
      }
    },
    text(i, str, color = '#fff', size = 30) { const [x, y, s] = center(i); add({ kind: 'text', x, y: y - 24 * s, vy: -70 * s, r: size * s, life: 1.1, text: str, color }); },
    confetti() {
      const r = cv.getBoundingClientRect(), colors = ['#ff5d73', '#ffd23f', '#84db4c', '#4f8dff', '#b56cff', '#ffffff'];
      for (let k = 0; k < 110; k++) add({ kind: 'conf', x: rand(0, r.width), y: rand(-30, r.height * .35), vx: rand(-70, 70), vy: rand(-260, 30),
        grav: 430, r: rand(4, 8), spin: rand(-12, 12), life: rand(1.4, 2.3), color: colors[k % colors.length] });
    },
    glow() {
      const r = cv.getBoundingClientRect();
      for (let k = 0; k < 46; k++) add({ kind: 'star', x: rand(0, r.width), y: rand(r.height * .3, r.height), vx: rand(-15, 15), vy: rand(-170, -60),
        r: rand(5, 12), life: rand(.8, 1.5), color: k % 3 ? '#ffe27a' : '#ffffff' });
    },
  };
})();

const stage = $('stage');
// Chạy lại một hiệu ứng CSS một lần (rung, loé sáng, nảy nút)
function jolt(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }

// ---------------------------------------------------------------------------
// Tim: thua mất 1 tim; dưới mức tối đa thì hồi dần theo thời gian thực
// ---------------------------------------------------------------------------
function regen() {
  let changed = false;
  while (save.hearts < MAX_HEARTS && save.heartAt && Date.now() - save.heartAt >= REGEN_MS) {
    save.hearts++;
    save.heartAt += REGEN_MS;
    changed = true;
  }
  if (save.hearts >= MAX_HEARTS && save.heartAt) { save.heartAt = null; changed = true; }
  if (changed) persist();
  return changed;
}

function setHearts(n) {
  if (n < save.hearts && save.hearts === MAX_HEARTS) save.heartAt = Date.now();
  save.hearts = Math.max(0, Math.min(MAX_HEARTS, n));
  if (save.hearts === MAX_HEARTS) save.heartAt = null;
  persist();
}

const outOfHearts = () => save.hearts === 0 && !lost;
const clock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function renderHearts(hit = -1, cls = 'hit') {
  $('hearts').innerHTML = $('homeHearts').innerHTML = Array.from({ length: MAX_HEARTS }, (_, k) => {
    const c = `${k < save.hearts ? '' : 'empty'}${k === hit ? ' ' + cls : ''}`;
    return catArt ? `<img class="${c}" src="${ART}ui/Icon_Life.png" alt="">` : `<span class="${c}">♥</span>`;
  }).join('');
}

function renderClock() {
  const left = save.heartAt ? clock(save.heartAt + REGEN_MS - Date.now()) : '';
  // Gọn để HUD còn chỗ cho ô xu: tim đầy thì không ghi gì
  $('regen').textContent = $('homeRegen').textContent = save.hearts < MAX_HEARTS ? `+1♥ ${left}` : '';
  $('nhText').textContent = `Tim tiếp theo sau ${left}`;
  $('nohearts').classList.toggle('show', screen === 'game' && outOfHearts());
}

// ---------------------------------------------------------------------------
// Vẽ: dùng chung cho bàn chơi, ảnh minh hoạ trong thẻ hướng dẫn và biểu tượng đếm loài
// ---------------------------------------------------------------------------
const pos = (i, lv = level) => [(i % lv.w) * SZ, Math.floor(i / lv.w) * SZ];
const pt = (m, a, r) => `${(m + r * Math.cos(a)).toFixed(1)} ${(m + r * Math.sin(a)).toFixed(1)}`;
// Kẹo chanh hình bông 6 cánh và quả cầu gai của virus
const FLOWER = (() => {
  const m = SZ / 2;
  let d = '';
  for (let k = 0; k < 6; k++) {
    const a0 = (k * 60 - 90) * Math.PI / 180, a1 = a0 + Math.PI / 3;
    d += (k ? '' : `M${pt(m, a0, 31)}`) + ` Q${pt(m, a0 + Math.PI / 6, 47)} ${pt(m, a1, 31)}`;
  }
  return d + ' Z';
})();
const SPIKES = Array.from({ length: 24 }, (_, k) => pt(SZ / 2, Math.PI * k / 12, k % 2 ? 30 : 40).replace(' ', ',')).join(' ');
const HEX = Array.from({ length: 6 }, (_, k) => pt(SZ / 2, Math.PI * k / 3 + Math.PI / 6, 38).replace(' ', ',')).join(' ');
const HEART = `M45 78 C12 56 6 34 20 22 C31 13 41 18 45 27 C49 18 59 13 70 22 C84 34 78 56 45 78 Z`;

function cellShape(c) {
  const m = SZ / 2, fill = `url(#g-${c.color})`, dark = COLORS[c.color][1];
  if (c.color === 'B') return `<rect x="${m - 35}" y="${m - 35}" width="70" height="70" rx="24" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
  if (c.color === 'C') return `<path d="${FLOWER}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'D') return `<path d="${HEART}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'E') return `<polygon points="${HEX}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'V') return `<polygon class="spikes" points="${SPIKES}" fill="${fill}" stroke="${dark}" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.color === 'G') return `<path class="flag" d="M${m - 31} ${m + 8} q-12 2 -13 15 M${m + 31} ${m - 8} q12 -2 13 -15" stroke="${dark}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="${m - 34}" y="${m - 22}" width="68" height="44" rx="22" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
  return `<circle cx="${m}" cy="${m}" r="36" fill="${fill}" stroke="${dark}" stroke-width="3"/>`;
}

// Mặt: tế bào ngủ nhắm mắt; virus cau mày và nhìn về hướng sắp lan; vi khuẩn cười nhếch.
function face(c, delay) {
  const m = SZ / 2, ink = '#2b0f2e';
  if (c.sleep) return `<path d="M${m - 17} ${m - 4} q6 6 12 0 M${m + 5} ${m - 4} q6 6 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="${m}" cy="${m + 11}" rx="3.5" ry="4.5" fill="${ink}"/>`;
  const [lx, ly] = c.color === 'V' ? LOOK[c.dir] : [0, 0];
  const eyes = `<g class="eyes" style="animation-delay:-${delay}s">
    <ellipse cx="${m - 11}" cy="${m - 4}" rx="7.5" ry="8.5" fill="#fff"/><ellipse cx="${m + 11}" cy="${m - 4}" rx="7.5" ry="8.5" fill="#fff"/>
    <g class="look" style="transform:translate(${lx * 3}px,${ly * 3}px)">
      <circle cx="${m - 11}" cy="${m - 3}" r="4.3" fill="${ink}"/><circle cx="${m + 11}" cy="${m - 3}" r="4.3" fill="${ink}"/>
      <circle cx="${m - 12.5}" cy="${m - 5}" r="1.5" fill="#fff"/><circle cx="${m + 9.5}" cy="${m - 5}" r="1.5" fill="#fff"/></g></g>`;
  if (c.color === 'V') return `${eyes}<path d="M${m - 19} ${m - 16} l10 5 M${m + 19} ${m - 16} l-10 5" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M${m - 9} ${m + 13} l3 -4 l3 4 l3 -4 l3 4 l3 -4" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (c.color === 'G') return `${eyes}<path d="M${m - 7} ${m + 10} q7 4 13 -3" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `${eyes}<ellipse cx="${m - 21}" cy="${m + 8}" rx="5" ry="3" fill="#ff8fb5" opacity=".75"/><ellipse cx="${m + 21}" cy="${m + 8}" rx="5" ry="3" fill="#ff8fb5" opacity=".75"/>
    <path class="mouth" d="M${m - 6} ${m + 8} q6 6 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}

// Loài A–E dùng mèo Shikacat (mắt sao khi vào đúng hộp hoặc khi thắng); vi khuẩn và virus vẫn tự vẽ.
// Thiếu ảnh nào trong thư mục shikacat thì cả game quay về kẹo dẻo tự vẽ. Bản export có 12 màu mèo, mới dùng 5:
// bỏ các màu dễ lẫn (WarmPink giống đỏ, Orange giống vàng, Green/Lime giống vi khuẩn và ô độc, các màu xanh giống B).
const CAT = { A: 'Red', B: 'Blue', C: 'Yellow', D: 'Pink', E: 'Purple' };
let catArt = true;
const catSrc = (col, happy = false) => `${ART}cats/Image_Cat_${CAT[col]}${happy ? 'EndGame' : ''}.png`;

// Vẽ đè lên mặt mèo (mặt bất lực, chớp mắt, ngáp...). Ảnh Shikacat không tách mắt, miệng: phủ mắt và miệng bằng
// đúng màu lông (lấy mẫu từ ảnh, vị trí đo trên ảnh 565×681) rồi vẽ lên; mặt kẹo tự vẽ thì ẩn mắt, miệng bằng CSS
// (lớp .sorry / .faceoff trên ô).
const FUR = { A: ['#fd8265', '#9c0f0f'], B: ['#388bde', '#123f8f'], C: ['#f9da83', '#7a3104'], D: ['#f5a7d2', '#5d031c'], E: ['#886dce', '#2b0a63'] };
function faceOf(c) {
  const m = SZ / 2, art = !!(catArt && CAT[c.color]);
  const [fur, ink] = art ? FUR[c.color] : ['', '#2b0f2e'];
  const [xl, xr, ey, mx, my] = art ? [m - 15, m + 10.7, m - 18.3, m - 2.3, m - 12.6] : [m - 11, m + 11, m - 4, m, m + 10];
  return { art, fur, ink, xl, xr, ey, mx, my, w: art ? 6 : 7 };
}
const coverEyes = f => f.art ? `<ellipse cx="${f.xl}" cy="${f.ey}" rx="8.2" ry="7.6" fill="${f.fur}"/><ellipse cx="${f.xr}" cy="${f.ey}" rx="8.2" ry="7.6" fill="${f.fur}"/>` : '';
const coverMouth = f => f.art ? `<ellipse cx="${f.mx}" cy="${f.my + .4}" rx="4.6" ry="2.4" fill="${f.fur}"/>` : '';
// Mắt nhắm: `bend` âm là cong lên (∩, bất lực), dương là cong xuống (‿, thư thái)
const shutEyes = (f, bend) => `<path d="M${f.xl - f.w} ${f.ey + 1} q${f.w} ${bend} ${f.w * 2} 0 M${f.xr - f.w} ${f.ey + 1} q${f.w} ${bend} ${f.w * 2} 0"
  stroke="${f.ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

// Mặt bất lực khi thua, như emoji cười gượng đổ mồ hôi: mắt nhắm cong, miệng mếu, giọt mồ hôi bên trán.
function sadFace(c) {
  const m = SZ / 2, f = faceOf(c), { ink, mx, my } = f;
  return `<g class="sadface">${coverEyes(f)}${coverMouth(f)}${shutEyes(f, -7)}
    <path d="M${mx - 3.5} ${my + 1.5} q3.5 -3.4 7 0" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <g transform="translate(${m - 29} ${m - 33})"><g class="sweat"><path d="M0 -8 C3.5 -3 6 1 6 4 A6 6 0 0 1 -6 4 C-6 1 -3.5 -3 0 -8 Z" fill="#8fd3ff" stroke="#2d7fd1" stroke-width="1.6"/>
      <ellipse cx="-2" cy="2.5" rx="1.5" ry="2.4" fill="#fff" opacity=".85"/></g></g></g>`;
}

// Mèo ngủ: bịt mắt có in hai mắt nhắm, đặt đúng chỗ mắt trong ảnh
function sleepMask(m) {
  return `<rect x="${m - 30}" y="${m - 27}" width="56" height="16" rx="8" fill="#26357f" stroke="#fff" stroke-width="2"/>
    <path d="M${m - 20} ${m - 21} q5 5 10 0 M${m + 5} ${m - 21} q5 5 10 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
}

// Vệt bóng sáng góc trên trái theo từng hình (lệch so với tâm ô: dx, dy, bán trục rx, ry, góc nghiêng):
// viên nang vi khuẩn dẹt và trái tim có đỉnh thấp nên vệt sáng phải hạ xuống, không thì lòi ra ngoài thân.
const SHINE = { G: [-15, -11, 10, 4.5, -18], D: [-16, -16, 9, 5, -40] };
function shine(color) {
  const [dx, dy, rx, ry, a] = SHINE[color] || [-13, -20, 11, 5.5, -32], x = SZ / 2 + dx, y = SZ / 2 + dy;
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".6" transform="rotate(${a} ${x} ${y})"/>`;
}

// Một tế bào, gốc toạ độ ở góc ô: bóng đổ, thân (mèo hoặc kẹo), chữ z khi ngủ. .lean để nghiêng theo hướng vuốt.
function cellBody(c) {
  const m = SZ / 2, d = ((Math.abs(c.id) * .73) % 5).toFixed(2);
  const art = catArt && CAT[c.color]
    ? `<image class="cat" href="${catSrc(c.color)}" x="${m - 35}" y="${m - 43}" width="70" height="84"/>${c.sleep ? sleepMask(m) : ''}`
    : `${cellShape(c)}${shine(c.color)}${face(c, d)}`;
  const badge = c.alt ? `<g class="dualBadge" transform="translate(${m + 24} ${m - 34})"><g class="dualPulse">
      <circle r="17" fill="${COLORS[c.alt][0]}" stroke="#fff" stroke-width="3.5"/>
      <text y="6" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" stroke="#10206b" stroke-width="3" paint-order="stroke">${c.left}</text></g></g>` : '';
  return `<g class="body"><g class="lean"><g class="jelly" style="animation-delay:-${(d * .55).toFixed(2)}s">
      <ellipse cx="${m}" cy="${m + 38}" rx="25" ry="5" fill="#0a1450" opacity=".25"/>
      ${art}
    </g></g>${badge}</g>
    <g class="zz" fill="#fff" stroke="#1a2f8f" stroke-width="5" paint-order="stroke" stroke-linejoin="round" font-weight="800">
      <text x="${SZ - 30}" y="22" font-size="28">z</text><text x="${SZ - 14}" y="6" font-size="19">z</text></g>`;
}

const icon = col => `<svg viewBox="-4 -6 98 104">${cellBody({ color: col, id: 1, dir: 'right' })}</svg>`;

// Đường viền liền bao quanh cả thân: lần theo cạnh biên của các ô (cả mép ngoài lẫn lỗ bên trong), nới ra `grow`,
// rồi bo tròn mọi góc. Cạnh được đi theo chiều kim đồng hồ quanh từng ô nên thân luôn nằm bên phải hướng đi:
// pháp tuyến hướng ra ngoài của cạnh hướng (dx, dy) là (dy, -dx); rẽ phải là góc lồi, rẽ trái là góc lõm.
// Chỗ hai lỗ (hoặc một lỗ và phần ngoài) chỉ chạm nhau ở một góc thì điểm đó có hai cạnh đi ra: luôn rẽ trái
// để mỗi lỗ là một vòng riêng, không vòng nào cắt chéo sang vòng khác.
function outlinePath(lv, grow, rConvex, rConcave) {
  const at = (r, c) => r >= 0 && c >= 0 && r < lv.h && c < lv.w && lv.slot[r * lv.w + c];
  const next = new Map();
  const edge = (x1, y1, x2, y2) => { const k = `${x1},${y1}`; if (!next.has(k)) next.set(k, []); next.get(k).push([x2, y2]); };
  for (let r = 0; r < lv.h; r++) for (let c = 0; c < lv.w; c++) {
    if (!at(r, c)) continue;
    if (!at(r - 1, c)) edge(c, r, c + 1, r);
    if (!at(r, c + 1)) edge(c + 1, r, c + 1, r + 1);
    if (!at(r + 1, c)) edge(c + 1, r + 1, c, r + 1);
    if (!at(r, c - 1)) edge(c, r + 1, c, r);
  }
  let d = '';
  while (next.size) {
    // Gom một vòng kín, chỉ giữ các điểm đổi hướng. Bắt đầu ở điểm chỉ có một cạnh đi ra để hướng rẽ luôn xác định.
    const loop = [];
    const start = [...next].find(([, outs]) => outs.length === 1)?.[0] ?? next.keys().next().value;
    let key = start, dx = 0, dy = 0;
    do {
      const [x, y] = key.split(',').map(Number), outs = next.get(key);
      // Rẽ trái: tích có hướng của hướng đến và hướng đi âm (toạ độ màn hình, trục y hướng xuống)
      const k = Math.max(0, outs.findIndex(([tx, ty]) => dx * (ty - y) - dy * (tx - x) < 0));
      const [to] = outs.splice(outs.length > 1 ? k : 0, 1);
      if (!outs.length) next.delete(key);
      dx = to[0] - x; dy = to[1] - y;
      loop.push([x, y, dx, dy]);
      key = `${to[0]},${to[1]}`;
    } while (key !== start && next.has(key));
    const corners = loop.filter((p, k) => { const q = loop[(k + loop.length - 1) % loop.length]; return q[2] !== p[2] || q[3] !== p[3]; });
    // Nới góc ra theo tổng hai pháp tuyến; bo góc lồi lớn, góc lõm nhỏ (không quá nửa cạnh kề)
    const pts = corners.map((p, k) => {
      const q = corners[(k + corners.length - 1) % corners.length];
      return { x: p[0] * SZ + grow * (q[3] + p[3]), y: p[1] * SZ - grow * (q[2] + p[2]), convex: q[2] * p[3] - q[3] * p[2] > 0 };
    });
    const n = pts.length, len = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const toward = (a, b, t) => `${(a.x + (b.x - a.x) * t / len(a, b)).toFixed(1)} ${(a.y + (b.y - a.y) * t / len(a, b)).toFixed(1)}`;
    pts.forEach((p, k) => {
      const prev = pts[(k + n - 1) % n], nxt = pts[(k + 1) % n];
      const r = Math.min(p.convex ? rConvex : rConcave, len(prev, p) / 2, len(p, nxt) / 2);
      d += `${k ? 'L' : 'M'}${toward(p, prev, r)} Q${p.x.toFixed(1)} ${p.y.toFixed(1)} ${toward(p, nxt, r)} `;
    });
    d += 'Z ';
  }
  return d;
}

// Khung gỗ liền một khối có viền sẫm, lòng khay, ô gạch Shikacat, ô độc sủi bọt có xương cá, hộp mục tiêu theo màu.
// Có `cells` thì tô hộp đã đạt.
function baseSvg(lv, cells = null) {
  let cups = '';
  lv.slot.forEach((s, i) => {
    if (!s) return;
    const [x, y] = pos(i, lv);
    if (lv.ice[i]) {
      cups += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="#cfefff" stroke="#7cc3ea" stroke-width="2.5"/>` +
        `<path d="M${x + 20} ${y + 30} l18 -12 M${x + 26} ${y + 70} l40 -26 M${x + 62} ${y + 24} l10 -6" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>`;
      return;
    }
    if (!lv.toxic[i]) {
      cups += catArt ? `<image href="${ART}ui/Tile_Board.png" x="${x + 1}" y="${y + 1}" width="${SZ - 2}" height="${SZ - 2}"/>`
        : `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="url(#g-cup)" stroke="#ff9cc4" stroke-width="2"/>`;
      return;
    }
    cups += `<rect x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}" rx="22" fill="url(#g-toxic)" stroke="#5f8a14" stroke-width="2.5"/>` +
      (catArt ? `<image href="${ART}ui/Image_FishBones_Default.png" x="${x + 14}" y="${y + 24}" width="62" height="46" opacity=".8"/>`
        : `<text x="${x + SZ / 2}" y="${y + SZ / 2 + 13}" text-anchor="middle" font-size="36" fill="#476b0d" opacity=".7">☠</text>`) +
      [[22, 64, 6, 0], [64, 70, 8, .7], [46, 60, 5, 1.4], [70, 40, 4, .35]].map(([bx, by, r, dl]) =>
        `<circle class="bub" cx="${x + bx}" cy="${y + by}" r="${r}" fill="#f4ffc9" style="animation-delay:-${dl}s"/>`).join('');
  });
  let rings = '';
  lv.target.forEach((t, i) => {
    if (!t) return;
    const [x, y] = pos(i, lv), ok = cells && cells[i] && cells[i].color === t;
    rings += catArt && CAT[t]
      ? `<g class="ring box${ok ? ' ok' : ''}" data-i="${i}"><image href="${ART}cats/Panel_Box_${CAT[t]}.png" x="${x + 2}" y="${y + 2}" width="${SZ - 4}" height="${SZ - 4}"/></g>`
      : `<circle class="ring${ok ? ' ok' : ''}" data-i="${i}" cx="${x + SZ / 2}" cy="${y + SZ / 2}" r="42" fill="${COLORS[t][0]}" stroke="${COLORS[t][1]}"
      style="animation-delay:-${i * 1.3}s"/>`;
  });
  const frame = outlinePath(lv, 19, 34, 20);
  return `<path d="${frame}" transform="translate(0 8)" fill="#0a1450" opacity=".4"/>
    <path d="${frame}" fill="url(#g-body)" stroke="#7d4322" stroke-width="4" stroke-linejoin="round"/>
    <path d="${outlinePath(lv, 15.5, 30, 17)}" fill="none" stroke="#ffe1c2" stroke-opacity=".6" stroke-width="2"/>
    <path d="${outlinePath(lv, 6, 22, 10)}" fill="#b4714a" stroke="#93522e" stroke-width="2"/>
    ${cups}${rings}`;
}

// Màng một chiều: dải thạch xanh ngọc trên cạnh giữa hai ô, mũi tên nhích theo chiều được đi qua.
function wallsSvg(lv) {
  return lv.oneway.map(([i, j, dir]) => {
    const [x1, y1] = pos(i, lv), [x2, y2] = pos(j, lv);
    const cx = (x1 + x2) / 2 + SZ / 2, cy = (y1 + y2) / 2 + SZ / 2;
    const bar = dir === 'left' || dir === 'right'
      ? `<rect x="${cx - 6}" y="${cy - 38}" width="12" height="76" rx="6"/>`
      : `<rect x="${cx - 38}" y="${cy - 6}" width="76" height="12" rx="6"/>`;
    return `<g fill="url(#g-gel)" stroke="#0f7062" stroke-width="2.5">${bar}</g>
      <g transform="rotate(${ANGLE[dir]} ${cx} ${cy})"><circle cx="${cx}" cy="${cy}" r="15" fill="#0f7062" stroke="#fff" stroke-width="2.5"/>
      <path class="chev" d="M${cx - 5} ${cy - 8} L${cx + 4} ${cy} L${cx - 5} ${cy + 8}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }).join('');
}

// Cổng dịch chuyển: hai vòng xoáy cùng màu ở mép hai ô, nhìn ra ngoài bàn; vòng xoay chậm cho biết đó là một cặp.
const GATE_COLORS = ['#b57bff', '#ff7ac8', '#38d9c8'];
function portalSvg(lv) {
  const gate = (cell, dir, color) => {
    const [x, y] = pos(cell, lv), [dr, dc] = DIRS[dir];
    const cx = x + SZ / 2 + dc * (SZ / 2 - 4), cy = y + SZ / 2 + dr * (SZ / 2 - 4);
    const vertical = dir === 'left' || dir === 'right';
    const rx = vertical ? 11 : 36, ry = vertical ? 36 : 11;
    return `<g class="portal"><ellipse cx="${cx}" cy="${cy}" rx="${rx + 6}" ry="${ry + 6}" fill="${color}" opacity=".28"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#1a0f3c" stroke="${color}" stroke-width="4"/>
      <ellipse class="swirl" cx="${cx}" cy="${cy}" rx="${rx * .55}" ry="${ry * .55}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round"/></g>`;
  };
  return lv.portals.map(([i, j, dir], k) => gate(i, dir, GATE_COLORS[k % GATE_COLORS.length]) + gate(j, OPPOSITE[dir], GATE_COLORS[k % GATE_COLORS.length])).join('');
}

// Mũi tên xem trước hướng chia: trắng nếu chia được, đỏ nếu bị chặn.
function arrowSvg(lv, from, dir) {
  const [x, y] = pos(from, lv).map(v => v + SZ / 2);
  const col = step(lv, from, dir) < 0 ? '#ff4d6d' : '#ffffff';
  return `<g transform="rotate(${ANGLE[dir]} ${x} ${y})" opacity=".95" stroke-linecap="round">
    <path d="M${x + 12} ${y} H${x + 56}" stroke="#10206b" stroke-width="17"/><path d="M${x + 12} ${y} H${x + 56}" stroke="${col}" stroke-width="9"/>
    <path d="M${x + 52} ${y - 15} L${x + 76} ${y} L${x + 52} ${y + 15} Z" fill="${col}" stroke="#10206b" stroke-width="4" stroke-linejoin="round"/></g>`;
}

// Ảnh tĩnh của một bàn (dùng trong thẻ hướng dẫn).
function boardSvg(lv, view, from = -1, dir = null) {
  let out = baseSvg(lv, view);
  view.forEach((c, i) => {
    if (!c) return;
    const [x, y] = pos(i, lv);
    out += `<g class="cell${c.sleep ? ' asleep' : ''}" transform="translate(${x} ${y})">${cellBody(c)}</g>`;
  });
  out += wallsSvg(lv) + portalSvg(lv) + (dir ? arrowSvg(lv, from, dir) : '');
  return `<svg viewBox="-24 -24 ${lv.w * SZ + 48} ${lv.h * SZ + 52}">${out}</svg>`;
}

// ---------------------------------------------------------------------------
// Bàn chơi
// ---------------------------------------------------------------------------
function load(i) {
  index = Math.max(0, Math.min(LEVELS.length - 1, i));
  level = parseLevel(LEVELS[index]);
  cells = level.init.slice();
  nextId = level.nextId;
  history = [];
  mode = null;
  fx.clear();
  save.level = index;
  persist();
  $('sub').textContent = `Level ${index + 1}/${LEVELS.length}`;
  $('goal').textContent = goalOf(level);
  $('solvedText').textContent = level.kill ? '🎉 Sạch khuẩn, đầy ổ!' : level.hasTarget ? '🎉 Đầy ổ, đúng hộp!' : '🎉 Ổ mèo đã kín!';
  $('next').disabled = index === LEVELS.length - 1 || !unlocked(index + 1);
  // Tính số lần vuốt tối ưu sau khi màn đã hiện, để bộ đếm có mốc 3 sao
  const at = index;
  if (!parCache.has(at)) setTimeout(() => { parOf(at); if (screen === 'game' && at === index) update(); }, 60);
  buildBoard();
  sync(cells);
  ringsOk = new Set(level.target.map((t, k) => t && cells[k] && cells[k].color === t ? k : -1).filter(k => k >= 0));
  toast('', 0);
  coached = false;
  renderHearts();
  renderCoins();
  update();
  const fresh = MECHANICS.filter(m => m.has(level, index) && !save.seen.includes(m.key));
  if (fresh.length) showLearn(fresh, true);
}

// Mục tiêu luôn là lấp kín; cơ chế chỉ thêm điều kiện (hiện ở bảng nhiệm vụ bên dưới).
const goalOf = lv => '🐾 Lấp kín khoảng trống' + (lv.toxic.some(Boolean) ? ' (trừ ô độc)' : '')
  + (lv.hasTarget ? (catArt ? ' + mèo vào hộp cùng màu' : ' + đúng màu ở mọi vòng') : '')
  + (lv.kill ? ' + diệt sạch vi khuẩn' : '') + (hasVirus(lv) ? ' + diệt hết virus' : '');

// Bảng nhiệm vụ theo những gì đang hiện trên bàn: ô đã lấp bằng mèo, hộp đúng màu, vi khuẩn và virus còn lại.
function renderTasks() {
  const room = level.slot.map((s, i) => s && !level.toxic[i]);
  const filled = shown.filter((c, i) => room[i] && c && c.color !== 'V' && c.color !== level.kill).length;
  const total = room.filter(Boolean).length;
  const task = (ok, text) => `<span class="${ok ? 'ok' : ''}">${ok ? '✓ ' : ''}${text}</span>`;
  let out = task(filled === total, `Lấp kín ${filled}/${total}`);
  const boxes = level.target.filter(Boolean).length;
  if (boxes) {
    const right = level.target.filter((t, i) => t && shown[i] && shown[i].color === t).length;
    out += task(right === boxes, `${catArt ? 'Hộp' : 'Vòng'} ${right}/${boxes}`);
  }
  if (level.kill) { const n = shown.filter(c => c && c.color === level.kill).length; out += task(!n, n ? `Vi khuẩn còn ${n}` : 'Hết vi khuẩn'); }
  if (hasVirus(level)) { const n = shown.filter(c => c && c.color === 'V').length; out += task(!n, n ? `Virus còn ${n}` : 'Hết virus'); }
  $('tasks').innerHTML = out;
}

// Bước hướng dẫn đang chờ, tính theo số nước đã đi từ đầu màn (hoàn tác thì lùi về bước trước).
function tutStep() {
  const def = LEVELS[index];
  if (screen !== 'game' || !level || Array.isArray(def) || !def.tut || solved || lost) return null;
  const k = movesNow();
  if (k >= def.tut.length) return null;
  const [r, c, dir, text] = def.tut[k];
  return { from: r * level.w + c, dir, text };
}

// Mẹo đầu màn (trường tip): chỉ một bong bóng lời thoại, không khoá nước nào, tắt sau nước đầu tiên.
// Dùng ở level đầu tiên có một yếu tố mới mà không cần cả bài hướng dẫn.
function tipText() {
  const def = LEVELS[index];
  return screen === 'game' && level && !Array.isArray(def) && def.tip && !busy && !solved && !lost && !movesNow() ? def.tip : null;
}

// Lớp hướng dẫn: làm tối cả bàn trừ ô mèo cần vuốt và ô đích, vệt chấm chạy theo hướng vuốt, bàn tay lướt qua,
// bong bóng lời thoại phía trên bàn. Hết bước hướng dẫn thì nhắc người chơi tự làm tiếp.
function renderCoach() {
  const t = busy ? null : tutStep(), box = $('coach');
  const holder = $('coachLayer');
  const tip = t ? null : tipText();
  if (tip) {
    if (holder) holder.innerHTML = '';
    if (box.hidden || box.textContent !== tip) { box.textContent = tip; box.hidden = false; }
    return;
  }
  if (!t) {
    box.hidden = true;
    if (holder) holder.innerHTML = '';
    if (coached && !busy && !solved && !lost) toast('Giỏi lắm! Giờ tự làm tiếp nhé 💪');
    if (!busy) coached = false;
    return;
  }
  coached = true;
  if (box.hidden || box.textContent !== t.text) {
    box.textContent = t.text;
    box.hidden = false;
    box.style.animation = 'none';
    void box.offsetWidth;                        // chạy lại hiệu ứng hiện bong bóng cho bước mới
    box.style.animation = '';
  }
